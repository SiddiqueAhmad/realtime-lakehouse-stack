[package]
name = "ducklake-standard-governed"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
[features]
default = ["df54"]
df54 = []
[[bin]]
name = "ducklake-qualification"
path = "src/worker.rs"
[[bin]]
name = "governed-delta-demo"
path = "src/query.rs"
[[bin]]
name = "seed-ducklake-fixture"
path = "src/seed.rs"
[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring"] }
datafusion = "=54.1.0"
datafusion-ducklake = { path = "vendor/ducklake", default-features = false, features = ["write-postgres", "tls-rustls-ring"] }
policast-core = { path = "vendor/policast/crates/policast-core" }
policast-datafusion = { path = "vendor/policast/crates/policast-datafusion" }
object_store = { version = "=0.13.2", features = ["aws"] }
url = "2.5"
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
