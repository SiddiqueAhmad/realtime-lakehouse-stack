[package]
name = "governed-delta-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
default-run = "governed-delta-demo"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
serde_json = "1"
datafusion = "=53.1.0"
deltalake = { version = "=0.32.4", features = ["datafusion", "s3"] }

# Iceberg 0.10.0 is intentionally selected for Reference B: it supports
# Iceberg format v3 while using DataFusion 53.1.0, exactly matching the
# Policast/Delta reference. 0.10.1 moved to DataFusion 55 and cannot share
# TableProvider trait objects with the currently pinned Policast build.
iceberg = "=0.10.0"
iceberg-datafusion = "=0.10.0"
iceberg-catalog-sql = "=0.10.0"
iceberg-storage-opendal = { version = "=0.10.0", default-features = false, features = ["opendal-s3"] }

# DuckLake Reference C deliberately uses the newest datafusion-ducklake release
# on the same DataFusion major as the existing Policast boundary. Releases
# 0.4+ moved to DataFusion 54; 0.3.0 remains on DataFusion 53. Disable default
# DuckDB bundling: this reference uses Postgres metadata + MinIO only.
datafusion-ducklake = { version = "=0.3.0", default-features = false, features = ["write-postgres"] }
object_store = { version = "=0.13.2", features = ["aws"] }
url = "2.5"

policast-core = { git = "https://github.com/open-lakehouse/policast.git", rev = "c6891d553fa1105546668c75b9a0d175bc54f70d", package = "policast-core" }
policast-datafusion = { git = "https://github.com/open-lakehouse/policast.git", rev = "c6891d553fa1105546668c75b9a0d175bc54f70d", package = "policast-datafusion", features = ["delta"] }

# Full DWARF for DataFusion/Arrow/Cedar makes test links very memory hungry.
# Keep debug assertions and overflow checks; only omit debugger information
# and incremental compiler state. These are functional, not benchmark builds.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
