[package]
name = "ducklake-qualification"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
[features]
df54 = []
[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
datafusion = "=53.1.0"
datafusion-ducklake = { version = "=0.3.0", default-features = false, features = ["write-postgres"] }
object_store = { version = "=0.13.2", features = ["aws"] }
url = "2.5"
policast-core = { git = "https://github.com/open-lakehouse/policast.git", rev = "c6891d553fa1105546668c75b9a0d175bc54f70d" }
policast-datafusion = { git = "https://github.com/open-lakehouse/policast.git", rev = "c6891d553fa1105546668c75b9a0d175bc54f70d" }
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false
