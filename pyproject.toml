[project]
name = "realtime-lakehouse-stack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10.13",
    "dbt-duckdb>=1.9.6",
    "duckdb>=1.4.1",
    # dbt-duckdb doesn't declare this itself (checked: `pip show dbt-duckdb`
    # lists only dbt-adapters/dbt-common/dbt-core/duckdb as Requires), but
    # needs it at runtime for `dbt seed` and other DataFrame-backed code
    # paths - confirmed by a real `dbt seed` run failing with duckdb's own
    # "Invalid Input Error: 'numpy' is required for this operation, but it
    # wasn't installed" once it actually reached a live database for the
    # first time in this migration (e2e-pipeline.yml run 33257478754).
    "pandas>=2.0",
    # Used directly (not through dbt-duckdb) by
    # warehouse/duckdb_plugins/lineage_seq_udf.py's next_event_sequence()
    # UDF: a real atomic INSERT ... ON CONFLICT ... RETURNING against a
    # dedicated allocator table in the same Postgres server that backs the
    # DuckLake catalog, deliberately bypassing DuckDB/DuckLake so the
    # increment gets Postgres's own row-level locking instead of DuckLake's
    # snapshot-level conflict resolution (see that module's docstring for
    # why the latter doesn't catch this race). -binary avoids needing
    # Postgres build tooling/headers in CI and local dev alike.
    "psycopg2-binary>=2.9",
]
