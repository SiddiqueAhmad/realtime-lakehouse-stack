version: 2

models:
  - name: data_quality_summary
    description: >
      Per-pipeline-run rollup: pass/fail record counts per dataset, per
      pipeline_run_id (which run last merged each surviving row — see
      macros/cdc_reliability.sql). Answers "how did a specific run's batch
      look", not "how does the dataset look right now" — see
      current_quality_summary for that. No PHI-classified column.

  - name: current_quality_summary
    description: >
      CURRENT-STATE PASS rate per dataset, computed directly from the live
      silver views' present population (not by summing data_quality_summary
      across runs — see that model's own docstring for why those aren't
      interchangeable).
    columns:
      - name: dataset
        tests: [not_null, unique]
      - name: current_row_count
        tests: [not_null]
      - name: current_pass_rate_pct
        tests: [not_null]

  - name: cdc_freshness
    description: >
      Freshness and CDC lag per dataset, both measured from the SAME row
      (the one with the latest _loaded_at) rather than independently-maxed
      timestamps: cdc_lag_seconds is that row's own source-commit-to-load
      latency; staleness_seconds is how long ago that same load happened,
      relative to now. See macros/cdc_reliability.sql for
      cdc_source_ts_ns/_loaded_at, and the model's own docstring for why
      the two maxima can't just be subtracted from each other.
    columns:
      - name: dataset
        tests: [not_null, unique]
      - name: cdc_lag_seconds
        tests: [not_null]
      - name: staleness_seconds
        tests: [not_null]

  - name: cdc_volume_summary
    description: >
      Raw CDC event volume per dataset, split into unique vs. duplicate
      events (two-or-more raw log rows sharing the same natural key AND
      LSN — a literal redelivery of the same event, not just "another
      update to this key") and by operation type, against the current
      bronze row count, plus each of those as a rate (percentage of
      raw_event_count) — duplicate_rate_pct, insert_rate_pct,
      update_rate_pct, delete_rate_pct sum to ~100% by construction. See
      the model's own docstring for why a plain raw-count-vs-row-count
      ratio doesn't actually measure duplication.
    columns:
      - name: dataset
        tests: [not_null, unique]
      - name: raw_event_count
        tests: [not_null]
      - name: unique_event_count
        tests: [not_null]
      - name: duplicate_event_count
        tests: [not_null]
      - name: current_row_count
        tests: [not_null]

  - name: daily_encounter_summary
    description: >
      Aggregate-only encounter metrics (counts by date/type). No
      PHI-classified column.

  - name: record_lineage
    description: >
      Operational lineage / incident-investigation trace, one row per
      record in the 4 fully quality-gated entities (patients, encounters,
      diagnoses, lab_results): its CDC provenance (source_event_id,
      pipeline_run_id, cdc_operation/lsn/transaction), its current quality
      decision (quality_status/failed_checks), and whether it is currently
      trusted or quarantined. Current-state only — reflects each record's
      most recent quality decision, not the history of decisions leading up
      to it. Keyed on record_token, not the natural key — PHI-free, same
      broad access tier as the other observability models. See the model's
      own docstring.
    columns:
      - name: dataset
        tests: [not_null]
      - name: record_token
        # Globally unique now that the token includes the source table
        # (see macros/lineage.sql v3) - a genuine regression test for the
        # cross-entity collision this model exists to avoid.
        tests: [not_null, unique]
      - name: is_trusted
        tests: [not_null]
      - name: is_quarantined
        tests: [not_null]

  - name: record_lineage_event
    description: >
      Historical operational lineage / incident timeline: an append-only log
      of every quality decision record_lineage has ever computed for a
      record, keyed the same way (record_token, PHI-free). Unlike
      record_lineage (current-state, one row per record), this retains prior
      decisions — a record that was quarantined and later corrected to
      trusted has both rows here, in order. A new row is appended only when
      a record's decision actually changes from the last one logged for it,
      not on every run. See the model's own docstring, including its
      documented limitation (one entry per dbt run in which a decision
      changed, not one per underlying CDC event).
    columns:
      - name: ledger_key
        # record_token || ':' || pipeline_run_id. Unique because record_lineage
        # (this model's source) has at most one row per record_token per run,
        # and pipeline_run_id is one value per dbt invocation.
        tests: [not_null, unique]
      - name: record_token
        tests: [not_null]
      - name: logged_at
        tests: [not_null]
