warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Primary connection is deliberately just :memory: - the actual
      # warehouse (a self-hosted DuckLake catalog, backed by Postgres: the
      # same `db` service already running everything else in this stack, no
      # extra catalog service needed) is a named `attach:` entry below, not
      # this `path:`. That's not cosmetic: dbt-duckdb derives the default
      # `database` name from `path` via path_derived_database_name(), which
      # for a `ducklake:postgres:dbname=... host=... ...` path mis-parses
      # the space-separated DSN as if it were a nested URL and produces the
      # DSN string itself, verbatim (down to the password) - confirmed by a
      # real run (e2e-pipeline.yml 33257742502) failing dbt seed with
      # `Binder Error: Catalog "dbname=warehouse host=localhost port=5433
      # user=testuser ***" does not exist!`, then reading
      # dbt/adapters/duckdb/credentials.py's actual path_derived_database_name
      # implementation to confirm why. Putting the ducklake connection in
      # `attach:` with an explicit alias (matching how
      # infra-setup/scripts/dq.py already attaches it successfully) and
      # setting `database:` to that alias sidesteps the broken inference
      # entirely - dbt-duckdb explicitly allows `database` to differ from
      # the path-derived name when it matches an attach alias (see that
      # same file's __pre_deserialize__).
      path: ":memory:"
      database: lake
      extensions:
        - postgres
      # DuckLake stores table *metadata* (snapshots, schema, file listing)
      # transactionally in Postgres and *data* as Parquet under DATA_PATH,
      # which is what gives this stack real multi-process concurrent
      # read/write safety - a bare local .duckdb file doesn't have that.
      # This is the replacement for Iceberg + Lakekeeper's REST catalog +
      # MinIO. The `options` dict (not a top-level credentials field - only
      # Attachment has one, confirmed by reading credentials.py; a
      # top-level `options:` here, as an earlier version of this file had,
      # is silently ignored, meaning DATA_PATH was never actually being
      # passed at all) is what maps to DuckDB's ATTACH ... (DATA_PATH
      # '...') clause.
      #
      # Secondary attach, plain Postgres (not DuckLake): read-only view onto
      # Debezium's JDBC-sink landing tables (warehouse.raw_cdc.<table> — see
      # debezium-server-conf/application.properties). This is what
      # models/sources.yml's `ehr` source resolves against — the append-only
      # raw CDC event log, same role the raw Iceberg tables used to play.
      attach:
        - path: "ducklake:postgres:dbname={{ env_var('DUCKLAKE_CATALOG_DB', 'warehouse') }} host={{ env_var('DUCKLAKE_CATALOG_HOST', 'localhost') }} port={{ env_var('DUCKLAKE_CATALOG_PORT', '5433') }} user={{ env_var('DUCKLAKE_CATALOG_USER', 'testuser') }} password={{ env_var('DUCKLAKE_CATALOG_PASSWORD', 'testpass') }}"
          alias: lake
          is_ducklake: true
          options:
            data_path: "'{{ env_var('DUCKLAKE_DATA_PATH', '/tmp/ducklake_data') }}/'"
        - path: "dbname={{ env_var('RAW_CDC_DB', 'warehouse') }} host={{ env_var('RAW_CDC_HOST', 'localhost') }} port={{ env_var('RAW_CDC_PORT', '5433') }} user={{ env_var('RAW_CDC_USER', 'testuser') }} password={{ env_var('RAW_CDC_PASSWORD', 'testpass') }}"
          alias: raw
          options:
            type: postgres
            read_only: true
      # Registers hmac_sha256_hex(key, msg) as a callable SQL function (see
      # duckdb_plugins/lineage_udfs.py) — DuckDB has sha256() but no
      # built-in keyed HMAC, unlike Trino. Computing it in a Python UDF
      # rather than inline SQL is also a real security improvement over the
      # previous (Trino) design: the HMAC_KEY only ever gets read from the
      # environment inside this Python function — it never gets templated
      # into compiled SQL text, closing the exact "key can leak into query
      # logs" limitation docs/lineage_token_rotation.md documented for the
      # Trino version. See warehouse/macros/lineage.sql.
      module_paths:
        - duckdb_plugins
      plugins:
        - module: lineage_udfs
      schema: gold
      # threads: 1, NOT dbt's usual default of 4 or more: a real
      # e2e-pipeline.yml run (33268516850) segfaulted (exit 139, no dbt-level
      # error at all - a native crash) the first time this pipeline ever ran
      # `dbt run` across bronze + silver + quality + gold models together in
      # one invocation, which is also the first time it exercised more than
      # one thread concurrently writing to the DuckLake catalog. Could not
      # reproduce locally against a plain (non-DuckLake) DuckDB file with an
      # equivalent multi-model, multi-thread incremental workload - ran it
      # repeatedly, no crash - which points at DuckLake's own concurrent-write
      # handling specifically, not dbt-duckdb's incremental materialization in
      # general.
      #
      # DuckLake ITSELF is explicitly designed for multiple concurrent
      # writers - it coordinates via optimistic concurrency control against
      # its SQL catalog (Postgres here): writers don't take locks, and a
      # conflicting commit is rejected and retried rather than corrupting
      # anything. The crash we hit is not evidence DuckLake requires a
      # single writer; it's evidence that concurrent-write reliability in
      # the specific engine build we hit this with was still maturing.
      # Two real upstream reports from around that time -
      # duckdb/ducklake#233 ("concurrent writes don't really work at all...
      # just conflict and fail") and #243 (a duplicate-key error specific to
      # a freshly-created catalog's first write) - are both now CLOSED
      # (fixed via PR #236 and its own fix respectively). Neither report
      # describes a crash/segfault specifically, though, so this project
      # never pinned its own segfault to either issue's exact mechanism.
      #
      # RE-TESTED (2026-08-30, real e2e-pipeline.yml runs, not just reasoning
      # about closed upstream issues): flipped threads back to 4 and ran the
      # real pipeline three times. Runs 33300464909 and 33300714850 passed
      # clean. Run 33301008146 crashed - identical signature to the original
      # report: "Concurrency: 4 threads (target='dev')" immediately followed
      # by "Segmentation fault (core dumped)", exit 139, on
      # `dbt run --select br_patients sl_patients br_encounters sl_encounters`
      # - two different models being written concurrently, same as the
      # original crash. So the honest, current, re-verified answer is: this
      # is NOT fixed, it's INTERMITTENT - roughly 1 crash in 3 real attempts
      # in this environment, not something that reliably reproduces every
      # time but also not something that reliably doesn't. threads: 1 stays
      # required until that intermittent native crash is actually resolved
      # upstream (or a newer duckdb/ducklake build is confirmed clean across
      # many more real runs than three) - the dataset here is synthetic test
      # fixtures, so the lost parallelism costs nothing that matters.
      #
      # Note this is a DIFFERENT concurrency question than
      # gold.record_lineage_event's own event_sequence race (see that
      # model's CONCURRENCY CONTRACT comment and reliability-tests/14_*):
      # this setting controls INTRA-invocation thread parallelism (multiple
      # models built concurrently within one `dbt run` process, which is
      # what crashed here); event_sequence's race needs two separate `dbt
      # run` PROCESSES both writing the same model concurrently, which
      # threads: alone has no bearing on at any value.
      threads: 1
