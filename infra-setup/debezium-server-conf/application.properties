# Use jdbc sink: writes straight into Postgres (warehouse.raw_cdc.<table>),
# which DuckDB/DuckLake then reads via the postgres extension (see
# warehouse/profiles.yml). No Iceberg/Lakekeeper/MinIO/Trino in this stack
# anymore - see README's architecture section for why.
debezium.sink.type=jdbc
debezium.sink.jdbc.connection.url=jdbc:postgresql://db:5432/warehouse
# NOT `user`/`password` - those aren't real properties on the JDBC sink
# (io.debezium.connector.jdbc.JdbcSinkConnectorConfig). Root-caused by
# fetching that class's actual field constants from source
# (CONNECTION_USER = "connection.username", CONNECTION_PASSWORD =
# "connection.password") after a real run got past the "No consumer named
# jdbc" failure only to hit a different one - see the Dockerfile's own
# comment for that iteration's story.
debezium.sink.jdbc.connection.username=testuser
debezium.sink.jdbc.connection.password=testpass
# Append-only, NOT upserted: raw_cdc.<table> is the immutable CDC event log
# (every insert/update/delete event, one row each), not a current-state
# projection. warehouse/models/bronze applies the reliability engine
# (dedup/ordering/delete-handling — see macros/cdc_reliability.sql) on top
# of this log to produce current state, so replay/audit/forensic lineage
# can always be reconstructed from the actual event history instead of an
# already-collapsed view of it. insert.mode=insert + primary.key.mode=none
# is what makes every event its own row rather than an upsert.
debezium.sink.jdbc.insert.mode=insert
debezium.sink.jdbc.primary.key.mode=none
debezium.sink.jdbc.schema.evolution=basic
# delete.enabled=false (NOT delete.handling.mode, which isn't a real
# property either - same source-verified fix as connection.username/
# connection.password above) means a delete CDC event is never turned into
# an actual SQL DELETE against raw_cdc; unwrap.delete.tombstone.handling.mode
# below still lands it as its own row (this is false by default upstream,
# set explicitly here so the append-only intent is visible in this file
# rather than relying on the connector's default).
debezium.sink.jdbc.delete.enabled=false
# Rename topics from dbz.ehr.<table> down to just <table> before the sink
# sees them, so JDBC sink writes land in raw_cdc.<table> instead of a
# dotted, quoting-unfriendly table name (see the route transform below).
# collection.name.format is the current property name; table.name.format
# (used in earlier drafts of this file) is only a deprecated alias for it.
debezium.sink.jdbc.collection.name.format=raw_cdc.${topic}
# Property names above verified by reading JdbcSinkConnectorConfig and
# SinkConnectorConfig source directly (github.com/debezium/debezium,
# debezium-connector-jdbc and debezium-sink modules, tag v3.6.0.Final) -
# not assumed from older Debezium Server docs, after that assumption
# already caused one round of wrong property names (`user`/`password`/
# `delete.handling.mode`/`table.name.format` used as if they were current,
# when only the last is even a still-functional deprecated alias). Real
# validation still happens in .github/workflows/e2e-pipeline.yml in CI.
# The jdbc consumer itself isn't in the stock image - see
# debezium-server-conf/Dockerfile, confirmed the hard way (a real run
# failed with "No Debezium consumer named 'jdbc' is available" before that
# Dockerfile existed) - and 3.0.8.Final's debezium-server-dist never
# bundled a jdbc sink at all regardless (see that Dockerfile's own comment
# for why this stack now pins 3.6.0.Final).


# postgres source
debezium.source.plugin.name=pgoutput
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=db
debezium.source.database.port=5432
debezium.source.database.user=testuser
debezium.source.database.password=testpass
debezium.source.database.dbname=ehr
debezium.source.database.server.name=db
debezium.source.database.server.id=1234
debezium.source.schema.include.list=ehr
debezium.source.topic.prefix=dbz
# Emits a `transaction` block (id, total_order, data_collection_order) on
# every data change event, so event identity (source_event_id) can capture
# an event's position within its source transaction, not just its LSN.
# See warehouse/macros/lineage.sql (generate_source_event_id).
debezium.source.provide.transaction.metadata=true
# PHI tables use REPLICA IDENTITY FULL (see healthcare.sql) so DELETE events
# carry the full pre-image, which the reliability layer needs to retire rows
# without losing lineage of what was deleted.
# Offset/schema-history storage: the memiiso Iceberg sink used to persist
# this to Iceberg tables (IcebergOffsetBackingStore/IcebergSchemaHistory) -
# those classes came from that sink extension and are gone along with it.
# Debezium Server's own standard file-based implementations replace them;
# state lives in the container's filesystem, which is fine here since this
# stack is always started fresh in dev/CI, not resumed across restarts.
# see https://debezium.io/documentation/reference/stable/development/engine.html#advanced-consuming
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
# see https://debezium.io/documentation/reference/stable/development/engine.html#database-history-properties
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# enable event schemas - mandatory
debezium.format.value.schemas.enable=true
debezium.format.key.schemas.enable=true
debezium.format.value=json
debezium.format.key=json

# do event flattening. unwrap message! Also rename each event's topic from
# dbz.ehr.<table> down to just <table> - see
# debezium.sink.jdbc.table.name.format above, which uses that renamed topic
# as the raw_cdc.<table> name; without this, the sink would see the dotted
# topic name literally, which is an awkward table name to reference.
debezium.transforms=route,unwrap
debezium.transforms.route.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.route.regex=dbz\.ehr\.(.*)
debezium.transforms.route.replacement=$1
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,table,source.ts_ns,source.lsn,db,transaction.id,transaction.total_order,transaction.data_collection_order
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.unwrap.drop.tombstones=true

# ############ SET LOG LEVELS ############
quarkus.log.level=INFO
quarkus.log.console.json=false
