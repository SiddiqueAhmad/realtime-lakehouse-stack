services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    depends_on:
      - db
    volumes:
      - /dev/urandom:/dev/random:ro
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: testuser
      MB_DB_PASS: testpass
      MB_DB_HOST: db
      MB_SETUP_TOKEN: your_token # Use a strong random string here
    networks:
      - warehouse_net
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

  metabase-setup:
    build:
      context: .
      dockerfile: metabase/Dockerfile.metabase-setup
    container_name: metabase-setup
    depends_on:
      metabase:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - warehouse_net
    environment:
      # Metabase Details
      MB_URL: http://metabase:3000
      MB_SETUP_TOKEN: your_token
      # Admin User Details
      MB_ADMIN_EMAIL: admin@example.com
      MB_ADMIN_PASSWORD: YourSecurePassword1!
      MB_ADMIN_FIRST_NAME: Admin
      MB_ADMIN_LAST_NAME: User
      MB_SITE_NAME: My Lakehouse Data Platform
      # EHR (operational healthcare) DB Details
      INVENTORY_DB_HOST: db
      INVENTORY_DB_USER: testuser
      INVENTORY_DB_PASS: testpass
      INVENTORY_DB_DBNAME: ehr
      # NOTE: no DuckDB/DuckLake connection is wired up here. Metabase has no
      # first-party DuckDB driver (a community JDBC driver plugin exists but
      # isn't packaged here) - connecting Metabase to gold/* directly is a
      # known gap of this migration, not something silently dropped. Today
      # Metabase only gets the raw operational EHR Postgres connection;
      # querying gold.* means running `duckdb` directly (see README) until
      # this gap is closed.
    restart: "no"

  # Debezium Server, Kafka-less: streams Postgres CDC events straight to a
  # sink without a broker in between. debezium.sink.type=jdbc (see
  # debezium-server-conf/application.properties) writes every event as a new
  # row into warehouse.raw_cdc.<table> - append-only, matching the raw CDC
  # event log's previous role when it lived in Iceberg (see that file's own
  # comments for why append-only, not upserted, matters for replay/audit).
  #
  # The stock quay.io/debezium/server image does NOT have the jdbc sink
  # registered at runtime ("No Debezium consumer named 'jdbc' is
  # available" - confirmed against a real container, not assumed) - see
  # debezium-server-conf/Dockerfile, which installs the full
  # debezium-server-dist distribution on top of it.
  debezium:
    build:
      context: debezium-server-conf
      dockerfile: Dockerfile
    container_name: debezium
    networks:
      warehouse_net:
    depends_on:
      db:
        condition: service_healthy
      warehouse-db-init:
        condition: service_completed_successfully
    volumes:
      - ./debezium-server-conf/application.properties:/debezium/config/application.properties
      - debezium-data:/debezium/data

  db:
    image: timescale/timescaledb-ha:pg17
    container_name: db
    networks:
      warehouse_net:
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U testuser -p 5432 -d test" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 10s
    volumes:
      - ./timescale/init-all.sh:/docker-entrypoint-initdb.d/01-init-all.sh
      - ./timescale/healthcare.sql:/docker-entrypoint-initdb.d/healthcare.sql
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"

  # One-shot: creates the `warehouse` database (raw_cdc landing schema for
  # Debezium's JDBC sink, plus whatever schema the ducklake extension uses
  # for its own catalog metadata - see timescale/warehouse-db-init.sql) and
  # a dedicated read/write role for it, separate from the ehr replication
  # user. Split out from init-all.sh (which only runs on a truly fresh
  # Postgres data directory) so `docker compose down -v && up` reliably
  # re-creates it every time, same guarantee bootstrap/initialwarehouse used
  # to provide for Lakekeeper.
  warehouse-db-init:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    networks:
      warehouse_net:
    volumes:
      - ./timescale/warehouse-db-init.sql:/warehouse-db-init.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      # Retries around the psql call, not just a bare invocation: `db`'s
      # own healthcheck can report healthy in a narrow window during
      # TimescaleDB's two-phase startup (initdb, then an immediate
      # restart to apply tuned settings - see timescale/init-all.sh's own
      # log output) where the server is between those two processes and
      # genuinely not accepting connections yet. Confirmed as a real,
      # recurring race - not a one-off - by two separate e2e-pipeline.yml
      # runs failing identically ("connection to server at db ... port
      # 5432 failed: Connection refused") right as docker compose reports
      # `db` healthy, on two different commits. `depends_on: service_healthy`
      # only gates container start order, not "the server inside is
      # actually ready this instant" - so retry here rather than trying
      # to make the healthcheck itself airtight against a race in a
      # process this container doesn't control.
      - >
        for i in $$(seq 1 15); do
        PGPASSWORD=testpass psql -v ON_ERROR_STOP=1 -h db -U testuser -d test -f /warehouse-db-init.sql && exit 0;
        echo "warehouse-db-init: psql failed (attempt $$i/15), retrying in 2s..." >&2;
        sleep 2;
        done;
        echo "warehouse-db-init: giving up after 15 attempts" >&2;
        exit 1

networks:
  warehouse_net:
    name: warehousenet

volumes:
  debezium-data:
