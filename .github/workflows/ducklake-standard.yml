name: DuckLake standard PostgreSQL and Policast
on:
  push:
    branches: [feature/ducklake-standard-pg-df54]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ducklake-standard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: standard-pg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner syntax and reporting guards
        run: |
          python3 -m py_compile governance/ducklake-standard/*.py
          python3 -m unittest discover -s governance/ducklake-standard -p test_runner_units.py -v
          bash -n governance/ducklake-standard/test-standard.sh
          mkdir -p governance/ducklake-standard/evidence
          git rev-parse HEAD > governance/ducklake-standard/evidence/tested-commit.txt
          uname -m > governance/ducklake-standard/evidence/architecture.txt
          docker buildx create --name standard --driver docker-container --driver-opt memory=4g --driver-opt memory-swap=4g --use --bootstrap
      - name: Build unpatched storage control with DF54 Policast
        id: control_build
        run: |
          set -o pipefail
          docker buildx build --builder standard --load --progress=plain -f governance/ducklake-standard/Dockerfile --build-arg FIXES=0 -t ducklake-standard:upstream . 2>&1 | tee governance/ducklake-standard/evidence/control-build.log
      - name: Reproduce both defects on standard catalog without fixes
        id: control
        run: |
          cd governance/ducklake-standard
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init
          STANDARD_IMAGE=ducklake-standard:upstream python3 run.py --output control-evidence --case TT-05 --case SCHEMA-08 --expect-red 2>&1 | tee evidence/control.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r={x['id']:x for x in json.loads(Path('control-evidence/df54/results.json').read_text())['cases']}
          assert r['TT-05']['detail'].startswith('expired snapshot accepted'),r['TT-05']
          assert r['SCHEMA-08']['detail'].startswith('rowset mismatch:'),r['SCHEMA-08']
          PY
      - name: Build corrected storage and governed runtime
        id: corrected_build
        if: ${{ !cancelled() && steps.control_build.outcome == 'success' }}
        run: |
          set -o pipefail
          docker buildx build --builder standard --load --progress=plain -f governance/ducklake-standard/Dockerfile --build-arg FIXES=1 -t ducklake-standard:patched . 2>&1 | tee governance/ducklake-standard/evidence/corrected-build.log
      - name: Run standard qualification and unchanged 20 governance cases
        if: ${{ !cancelled() && steps.corrected_build.outcome == 'success' }}
        run: |
          cd governance/ducklake-standard
          docker compose up -d --wait postgres minio
          docker compose run --rm minio-init
          STANDARD_IMAGE=ducklake-standard:patched python3 run.py 2>&1 | tee evidence/qualification.log
      - name: Invalid snapshot, retry and catalog-layout regressions
        if: ${{ !cancelled() && steps.corrected_build.outcome == 'success' }}
        run: |
          cd governance/ducklake-standard
          STANDARD_IMAGE=ducklake-standard:patched python3 test_guards.py 2>&1 | tee evidence/guards.log
      - name: Capture resource and source evidence
        if: always()
        run: |
          mkdir -p governance/ducklake-standard/evidence
          docker exec buildx_buildkit_standard0 sh -c 'for f in memory.max memory.swap.max memory.peak memory.events; do echo "== $f =="; cat /sys/fs/cgroup/$f; done' > governance/ducklake-standard/evidence/build-memory.txt 2>&1 || true
          git archive HEAD governance/ducklake-standard governance/delta-policast-sme-demo > governance/ducklake-standard/evidence/tested-source.tar
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('governance/ducklake-standard/evidence/df54/results.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Standard PostgreSQL catalog + local Policast DF54 port\n')
              if not p.exists(): f.write('No complete behavioral report. NOT QUALIFIED.\n')
              else:
                  r=json.loads(p.read_text());f.write(str(r['counts'])+'\n\n')
                  f.write('| Case | Outcome | Detail |\n|---|---|---|\n')
                  for x in r['cases']:f.write(f"| {x['id']} | {x['status']} | {x['detail'].replace('|','/').replace(chr(10),' ')} |\n")
                  f.write('\nLogical expiry uses an explicitly labelled test fixture. Native standard maintenance and cross-engine writing are not claimed.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ducklake-standard-${{ matrix.arch }}
          path: |
            governance/ducklake-standard/evidence/
            governance/ducklake-standard/control-evidence/
            governance/ducklake-standard/guard-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Stop ephemeral CI resources
        if: always()
        run: |
          docker ps -aq --filter name=dq- | xargs -r docker rm -f
          docker compose -f governance/ducklake-standard/docker-compose.yml down
          docker buildx rm standard || true
