name: Governed Delta + Iceberg references
on:
  pull_request:
    paths:
      - 'governance/delta-policast-sme-demo/**'
      - '.github/workflows/governed-delta.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governed-lakehouse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    name: governance (${{ matrix.arch }}, 4GiB build)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      GOVERNED_QUERY_IMAGE: delta-policast-sme-demo-governed-query
    defaults:
      run:
        working-directory: governance/delta-policast-sme-demo
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and fixture checks
        run: |
          python3 -m unittest discover -s tests -p 'test_layout.py' -v
          python3 -m py_compile tests/test_governance.py
          for script in *.sh; do bash -n "$script"; done
      - name: Configure memory-limited native builder
        run: |
          mkdir -p ci-evidence
          uname -m | tee ci-evidence/architecture.txt
          git rev-parse HEAD | tee ci-evidence/tested-commit.txt
          docker buildx create --name governed-lowmem --driver docker-container \
            --driver-opt memory=4g --driver-opt memory-swap=4g --use --bootstrap
          docker inspect buildx_buildkit_governed-lowmem0 \
            --format 'memory={{.HostConfig.Memory}} memory_swap={{.HostConfig.MemorySwap}}' \
            | tee ci-evidence/build-limits.txt
          test "$(docker inspect buildx_buildkit_governed-lowmem0 --format '{{.HostConfig.Memory}}')" = 4294967296
          test "$(docker inspect buildx_buildkit_governed-lowmem0 --format '{{.HostConfig.MemorySwap}}')" = 4294967296
      - name: Build all binaries and run all Rust tests
        id: build
        run: |
          set -o pipefail
          docker buildx build --builder governed-lowmem --progress plain --load \
            --build-arg CARGO_BUILD_JOBS=1 --tag "$GOVERNED_QUERY_IMAGE" ./app \
            2>&1 | tee ci-evidence/build.log
      - name: Retain exact built lockfile
        run: |
          container=$(docker create --entrypoint /bin/true "$GOVERNED_QUERY_IMAGE")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/governed-query/Cargo.lock" ci-evidence/Cargo.lock
          docker image inspect "$GOVERNED_QUERY_IMAGE" --format '{{.Id}} {{.Architecture}}' \
            | tee ci-evidence/image.txt
      - name: Delta governance integration tests
        id: delta
        run: |
          set -o pipefail
          TABLE_FORMAT=delta SKIP_BUILD=1 bash test-governance.sh 2>&1 | tee ci-evidence/delta-governance.log
      - name: Iceberg v3 governance integration tests
        id: iceberg
        run: |
          set -o pipefail
          TABLE_FORMAT=iceberg SKIP_BUILD=1 bash test-governance.sh 2>&1 | tee ci-evidence/iceberg-governance.log
      - name: Migration preservation tests
        id: migration
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          docker compose up -d --wait postgres
          bash test-migration.sh 2>&1 | tee ci-evidence/migrations.log
      - name: Governance control-plane UI smoke test
        id: ui
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          bash migrate.sh
          docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U governance -d governance < fixtures/healthcare/governance.sql
          docker compose up -d governance-ui
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8088/api/health > ci-evidence/ui-health.json; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8088/ > ci-evidence/ui.html
          curl --fail --silent http://127.0.0.1:8088/api/state > ci-evidence/ui-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('ci-evidence/ui-state.json').read_text())
          assert state['counts']['principals'] >= 3
          assert state['counts']['policies'] >= 1
          assert state['counts']['tables'] >= 1
          html=Path('ci-evidence/ui.html').read_text()
          assert 'AI drafts' in html and 'Human approves' in html and 'Control-plane only' in html
          PY
          curl --fail --silent --get \
            --data-urlencode principal=analyst --data-urlencode table=patients \
            http://127.0.0.1:8088/api/effective > ci-evidence/ui-effective.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('ci-evidence/ui-effective.json').read_text())
          assert result['principal'] == 'analyst'
          assert result['table']['key'] == 'patients'
          assert len(result['policies']) >= 1
          assert 'rows' not in result
          PY
      - name: Resource evidence and summary
        if: always()
        run: |
          mkdir -p ci-evidence
          docker exec buildx_buildkit_governed-lowmem0 sh -c \
            'for file in memory.max memory.swap.max memory.peak memory.events; do echo "== $file =="; cat "/sys/fs/cgroup/$file"; done' \
            > ci-evidence/build-memory.txt 2>&1 || true
          {
            echo '## Governed Delta + Iceberg v3 + control plane UI: ${{ matrix.arch }}'
            echo 'Native build; BuildKit memory limit 4 GiB, swap disabled; Cargo jobs=1.'
            echo 'The same governance assertions run against both table formats.'
            echo 'Build/Rust: ${{ steps.build.outcome }}'
            echo 'Delta E2E: ${{ steps.delta.outcome }}'
            echo 'Iceberg v3 E2E: ${{ steps.iceberg.outcome }}'
            echo 'Migration checks: ${{ steps.migration.outcome }}'
            echo 'Governance UI smoke: ${{ steps.ui.outcome }}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dependency logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence-${{ matrix.arch }}
          path: governance/delta-policast-sme-demo/ci-evidence/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop ephemeral CI stack
        if: always()
        run: |
          docker compose down
          docker buildx rm governed-lowmem || true
