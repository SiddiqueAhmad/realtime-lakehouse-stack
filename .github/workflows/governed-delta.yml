name: Governed Delta reference
on:
  pull_request:
    paths:
      - 'governance/delta-policast-sme-demo/**'
      - '.github/workflows/governed-delta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: governance/delta-policast-sme-demo
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and fixture checks
        run: python3 -m unittest discover -s tests -p 'test_layout.py' -v
      - name: Build both binaries and run Rust tests
        run: docker compose build governed-query
      - name: Generic governance integration tests
        run: SKIP_BUILD=1 bash test-governance.sh
      - name: Migration preservation tests
        run: bash test-migration.sh
      - name: Dependency logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop ephemeral CI stack
        if: always()
        run: docker compose down
