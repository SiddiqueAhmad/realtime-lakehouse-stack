name: E2E pipeline reliability (best-effort)

# Runs the full Postgres -> Debezium -> Iceberg -> dbt -> Trino pipeline via
# docker compose and asserts reliability-tests/ scenarios 01-08 through the
# actual bronze/silver/quality layers and Trino's access control, not just
# at the Postgres source. See reliability-tests/README.md for what each
# scenario claims.
#
# Deliberately NOT gating every PR (workflow_dispatch + nightly only): this
# stands up MinIO, Lakekeeper, Postgres, Debezium, and Trino from cold and
# waits on Debezium's initial snapshot landing in Iceberg, which is slow and
# has more moving parts than the fast Postgres-only job in ci.yml. It was
# written and reviewed but could not be executed in the environment that
# authored it (no Docker daemon available there — see reliability-tests/README.md);
# treat its first few real runs as shakeout, not as already-proven, and
# promote it to a required PR check once it's demonstrated stable.
#
# No production secret of any kind is used here: RECORD_TOKEN_HMAC_KEY is
# generated fresh per run (openssl rand), and every other credential is the
# synthetic stack's own hardcoded dev value (testuser/testpass, MinIO
# admin/password, ...), matching infra-setup/docker-compose.yml. On failure,
# every service's logs (plus dbt's own log) are uploaded as a build
# artifact rather than left to scroll off the console.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # nightly

jobs:
  e2e-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dbt + deps
        run: uv sync

      - name: Install Trino CLI
        run: |
          curl -sSLo /usr/local/bin/trino \
            https://repo1.maven.org/maven2/io/trino/trino-cli/442/trino-cli-442-executable.jar
          chmod +x /usr/local/bin/trino

      - name: Generate a CI-only lineage HMAC key
        # Real RECORD_TOKEN_HMAC_KEY, generated fresh per run and never
        # logged or persisted — not the insecure dev fallback documented in
        # warehouse/macros/lineage.sql. Written to $GITHUB_ENV so every
        # later step (dbt run, dbt test) picks it up automatically. No
        # production secret of any kind is used anywhere in this workflow.
        run: echo "RECORD_TOKEN_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Enable minimum-necessary access control (scenario 08)
        # Turning this on from the start (rather than isolating it to the
        # scenario 08 step) is safe for scenarios 01-07: every query in this
        # workflow before scenario 08 runs as dbt's 'trino' user or the CI
        # runner's default identity, neither of which matches the
        # data_engineer.*/analyst.*/ai_agent.*/clinical_user.* patterns in
        # rules.json, so both fall through to its full-access fallback rule.
        # This is the first time this opt-in feature (previously untested —
        # see infra-setup/trino/access-control.properties.example) actually
        # gets exercised end-to-end.
        run: cp infra-setup/trino/access-control.properties.example infra-setup/trino/access-control.properties

      - name: Start the stack
        working-directory: infra-setup
        run: docker compose up -d

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=testpass pg_isready -h localhost -p 5433 -U testuser -d ehr > /dev/null 2>&1; then
              echo "Postgres is up"
              exit 0
            fi
            echo "waiting for Postgres... ($i/30)"
            sleep 3
          done
          echo "::error::Postgres did not become ready in time"
          exit 1

      - name: Wait for Trino to accept queries
        # Trino here isn't just the JVM booting - it's also registering the
        # iceberg catalog against Lakekeeper's REST catalog API, which in
        # turn depends on minio/lakekeeper already being healthy. On a
        # shared GitHub-hosted runner, that whole chain cold-starting
        # concurrently with Postgres/Debezium/Metabase can plausibly take
        # longer than a JVM boot alone would. Budget for that (90 x 5s =
        # 7.5 min, up from 60 x 5s = 5 min) rather than assuming 5 min is
        # always enough - this workflow had literally never been executed
        # before (see reliability-tests/README.md), so that number was a
        # guess, not something tuned against a real run.
        run: |
          for i in $(seq 1 90); do
            if trino --server http://localhost:8080 --execute "SELECT 1" > /dev/null 2>&1; then
              echo "Trino is up"
              exit 0
            fi
            echo "waiting for Trino... ($i/90)"
            sleep 5
          done
          echo "::error::Trino did not become ready in time"
          # Print Trino's own container log straight to the job console -
          # not just to the on-failure diagnostics artifact - so the root
          # cause is visible without a separate artifact download (which
          # needs its own network access from wherever these logs get
          # investigated, and isn't guaranteed).
          echo "::group::docker compose logs trino"
          ( cd infra-setup && docker compose logs --no-color trino ) || true
          echo "::endgroup::"
          echo "::group::docker compose logs lakekeeper"
          ( cd infra-setup && docker compose logs --no-color lakekeeper ) || true
          echo "::endgroup::"
          echo "::group::docker compose ps"
          ( cd infra-setup && docker compose ps -a ) || true
          echo "::endgroup::"
          exit 1

      - name: Wait for Debezium's initial snapshot to land in Iceberg
        # 4 seed patients (see infra-setup/timescale/healthcare.sql) is the
        # known-good row count for a clean start.
        run: |
          for i in $(seq 1 60); do
            n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED \
                  --execute "SELECT count(*) FROM icebergdata.debeziumcdc_dbz__ehr_patients" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "4" ] 2>/dev/null; then
              echo "snapshot landed ($n rows)"
              exit 0
            fi
            echo "waiting for CDC snapshot... ($i/60, currently $n rows)"
            sleep 10
          done
          echo "::error::Debezium's initial snapshot did not land in time"
          exit 1

      - name: dbt seed + run + test
        working-directory: warehouse
        run: |
          ../.venv/bin/dbt seed --profiles-dir .
          ../.venv/bin/dbt run  --profiles-dir .
          ../.venv/bin/dbt test --profiles-dir .

      - name: Run scenario 01 (duplicate event) directly against Iceberg
        # Trino-native — inserts straight into the raw CDC table, so there's
        # no Debezium delivery to wait on before the first dbt run below.
        run: trino --server http://localhost:8080 --catalog iceberg -f reliability-tests/01_duplicate_event.sql

      - name: Re-run bronze/silver for patients (redelivery merge #1)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_patients sl_patients --profiles-dir .

      - name: Assert scenario 01's outcome through the actual reliability engine
        run: |
          result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) || ',' || max_by(email, cdc_source_lsn) FROM bronze.br_patients WHERE patient_id = 2" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_patients result: $result"
          expected="1,morgan.sample+updated@synthetic.test"
          if [ "$result" != "$expected" ]; then
            echo "::error::Expected exactly 1 row with the updated email (redelivery of the identical event should be a no-op), got: $result"
            exit 1
          fi
          echo "Scenario 01 passed through the real Iceberg -> dbt bronze reliability engine."

      - name: Run scenario 02 (transaction order) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/02_transaction_order.sql

      - name: Wait for Debezium to stream the transaction's events
        run: |
          for i in $(seq 1 30); do
            patients_n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED \
                  --execute "SELECT count(*) FROM icebergdata.debeziumcdc_dbz__ehr_patients WHERE patient_id = 1" \
                  2>/dev/null | tail -n1 || echo 0)
            encounters_n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED \
                  --execute "SELECT count(*) FROM icebergdata.debeziumcdc_dbz__ehr_encounters WHERE encounter_id = 2" \
                  2>/dev/null | tail -n1 || echo 0)
            # 1 snapshot row + 2 UPDATE events each.
            if [ "${patients_n:-0}" -ge "3" ] 2>/dev/null && [ "${encounters_n:-0}" -ge "3" ] 2>/dev/null; then
              echo "transaction events landed (patients=$patients_n, encounters=$encounters_n)"
              exit 0
            fi
            echo "waiting for CDC events... ($i/30, patients=$patients_n, encounters=$encounters_n)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenario 02's CDC events to land (patients=${patients_n:-0}, encounters=${encounters_n:-0})"
          exit 1

      - name: Re-run bronze/silver for patients and encounters
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_patients sl_patients br_encounters sl_encounters --profiles-dir .

      - name: Assert scenario 02's outcome through the actual reliability engine
        run: |
          patients_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) || ',' || max_by(phone, cdc_source_lsn) FROM bronze.br_patients WHERE medical_record_number = 'MRN-SYN-00001'" \
                     2>/dev/null | tail -n1)
          encounters_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) || ',' || max_by(status, cdc_source_lsn) FROM bronze.br_encounters WHERE encounter_id = 2" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_patients result: $patients_result"
          echo "bronze.br_encounters result: $encounters_result"
          ok=true
          [ "$patients_result" = "1,555-010-9902" ] || { echo "::error::patients: expected 1,555-010-9902 got $patients_result"; ok=false; }
          [ "$encounters_result" = "1,finished" ] || { echo "::error::encounters: expected 1,finished got $encounters_result"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 02 passed end-to-end through Postgres -> Debezium -> Iceberg -> dbt bronze."

      - name: Run scenario 03 (out-of-order replay) directly against Iceberg
        run: trino --server http://localhost:8080 --catalog iceberg -f reliability-tests/03_out_of_order_replay.sql

      - name: Re-run bronze/silver for lab_results
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_lab_results sl_lab_results --profiles-dir .

      - name: Assert scenario 03's outcome
        run: |
          result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT result_value, cdc_source_lsn FROM bronze.br_lab_results WHERE lab_result_id = 9001" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_lab_results result: $result"
          if [ "$result" != "4.2,900000002" ]; then
            echo "::error::Expected the higher-LSN (4.2) value to win over the lower-LSN out-of-order replay, got: $result"
            exit 1
          fi
          echo "Scenario 03 passed: the out-of-order (lower-LSN) event was correctly a no-op."

      - name: Run scenario 04 (deleted diagnosis) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/04_deleted_diagnosis.sql

      - name: Wait for Debezium to stream the delete event
        run: |
          for i in $(seq 1 30); do
            n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED \
                  --execute "SELECT count(*) FROM icebergdata.debeziumcdc_dbz__ehr_diagnoses WHERE diagnosis_id = 3 AND __op = 'd'" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "1" ] 2>/dev/null; then
              echo "delete event landed"
              exit 0
            fi
            echo "waiting for CDC delete event... ($i/30)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenario 04's CDC delete event to land"
          exit 1

      - name: Re-run bronze/silver/quality for diagnoses (scenario 04)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses --profiles-dir .

      - name: Assert scenario 04's outcome
        run: |
          bronze_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT is_deleted, cdc_operation FROM bronze.br_diagnoses WHERE diagnosis_id = 3" \
                     2>/dev/null | tail -n1)
          silver_n=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) FROM silver.sl_diagnoses WHERE diagnosis_id = 3" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_diagnoses result: $bronze_result, silver row count: $silver_n"
          ok=true
          [ "$bronze_result" = "true,d" ] || { echo "::error::bronze: expected true,d (retained with is_deleted, audit trail preserved) got $bronze_result"; ok=false; }
          [ "${silver_n:-1}" = "0" ] || { echo "::error::silver: expected the deleted row excluded (0 rows) got $silver_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 04 passed: delete retained as an audit trail in bronze, excluded downstream."

      - name: Run scenario 05 (invalid patient reference) directly against Iceberg
        run: trino --server http://localhost:8080 --catalog iceberg -f reliability-tests/05_invalid_patient_reference.sql

      - name: Re-run bronze/silver/quality for diagnoses (scenario 05)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses --profiles-dir .

      - name: Assert scenario 05's outcome (also covers scenario 09 - quarantine split)
        run: |
          silver_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT quality_status, failed_checks FROM silver.sl_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          trusted_n=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) FROM quality.trusted_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          quarantine_n=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) FROM quality.quarantine_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          echo "silver: $silver_result, trusted: $trusted_n, quarantine: $quarantine_n"
          ok=true
          case "$silver_result" in FAIL,*patient_not_found*) ;; *) echo "::error::silver: expected FAIL with patient_not_found, got $silver_result"; ok=false ;; esac
          [ "${trusted_n:-1}" = "0" ] || { echo "::error::trusted_diagnoses should not contain the orphaned row, got count=$trusted_n"; ok=false; }
          [ "${quarantine_n:-0}" = "1" ] || { echo "::error::quarantine_diagnoses should contain exactly the orphaned row, got count=$quarantine_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 05 passed: referential integrity gate quarantined the orphaned row."

      - name: Run scenarios 06+07 (impossible value, missing field) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/06_impossible_lab_value.sql
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/07_missing_required_field.sql

      - name: Wait for Debezium to stream both new lab results
        run: |
          for i in $(seq 1 30); do
            n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED \
                  --execute "SELECT count(*) FROM icebergdata.debeziumcdc_dbz__ehr_lab_results WHERE result_value = 55.0 OR (loinc_code = '2345-7' AND result_value IS NULL)" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "2" ] 2>/dev/null; then
              echo "both events landed ($n rows)"
              exit 0
            fi
            echo "waiting for CDC events... ($i/30, currently $n rows)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenarios 06+07's CDC events to land (only $n/2 rows present)"
          exit 1

      - name: Re-run bronze/silver/quality for lab_results (scenarios 06+07)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_lab_results sl_lab_results trusted_lab_results quarantine_lab_results --profiles-dir .

      - name: Assert scenarios 06+07's outcome
        run: |
          impossible_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT quality_status, failed_checks FROM silver.sl_lab_results WHERE result_value = 55.0" \
                     2>/dev/null | tail -n1)
          missing_result=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT quality_status, failed_checks FROM silver.sl_lab_results WHERE loinc_code = '2345-7' AND result_value IS NULL" \
                     2>/dev/null | tail -n1)
          quarantine_n=$(trino --server http://localhost:8080 --catalog iceberg \
                     --output-format CSV_UNQUOTED \
                     --execute "SELECT count(*) FROM quality.quarantine_lab_results WHERE result_value = 55.0 OR (loinc_code = '2345-7' AND result_value IS NULL)" \
                     2>/dev/null | tail -n1)
          echo "impossible value: $impossible_result, missing field: $missing_result, quarantined: $quarantine_n"
          ok=true
          case "$impossible_result" in FAIL,*result_out_of_range*) ;; *) echo "::error::scenario 06: expected FAIL with result_out_of_range, got $impossible_result"; ok=false ;; esac
          case "$missing_result" in FAIL,*missing_result_value*) ;; *) echo "::error::scenario 07: expected FAIL with missing_result_value, got $missing_result"; ok=false ;; esac
          [ "${quarantine_n:-0}" = "2" ] || { echo "::error::expected both rows quarantined, got count=$quarantine_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenarios 06+07 passed: clinical plausibility and completeness gates quarantined both rows."

      - name: Assert scenario 08 (minimum-necessary access control)
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # analyst: denied PHI/QUASI_PHI + SENSITIVE surrogate-key columns.
          trino --server http://localhost:8080 --catalog iceberg --user analyst_jane \
              --execute "SELECT first_name, last_name, medical_record_number, patient_id FROM silver.sl_patients LIMIT 1" \
              > /tmp/analyst_phi.log 2>&1 \
            && fail "analyst should be denied PHI/surrogate columns, but the query succeeded: $(cat /tmp/analyst_phi.log)"
          echo "analyst correctly denied PHI/surrogate-key columns"

          # analyst: allowed non-PHI + quality metadata, correlating via record_token.
          trino --server http://localhost:8080 --catalog iceberg --user analyst_jane \
            --execute "SELECT record_token, gender, state, quality_status FROM silver.sl_patients LIMIT 5" > /dev/null \
            || fail "analyst should be allowed record_token/gender/state/quality_status on silver.sl_patients"
          echo "analyst correctly allowed non-PHI + quality metadata"

          # analyst: NO access at all to bronze/raw (pipeline internals, not this tier's).
          trino --server http://localhost:8080 --catalog iceberg --user analyst_jane \
              --execute "SELECT quality_status FROM bronze.br_patients LIMIT 1" \
              > /tmp/analyst_bronze.log 2>&1 \
            && fail "analyst should have no access to bronze/raw, but the query succeeded: $(cat /tmp/analyst_bronze.log)"
          echo "analyst correctly denied all bronze/raw access"

          # analyst: allowed the de-identified / aggregate-only layers.
          trino --server http://localhost:8080 --catalog iceberg --user analyst_jane \
            --execute "SELECT * FROM deid.patients_deidentified LIMIT 5" > /dev/null \
            || fail "analyst should be allowed deid.patients_deidentified"
          trino --server http://localhost:8080 --catalog iceberg --user analyst_jane \
            --execute "SELECT * FROM gold.daily_encounter_summary LIMIT 5" > /dev/null \
            || fail "analyst should be allowed gold.daily_encounter_summary"
          echo "analyst correctly allowed deid/gold"

          # data_engineer: allowed operational metadata + surrogate keys, denied PHI values.
          trino --server http://localhost:8080 --catalog iceberg --user data_engineer_pat \
            --execute "SELECT patient_id, quality_status, cdc_source_lsn FROM bronze.br_patients LIMIT 5" > /dev/null \
            || fail "data_engineer should be allowed patient_id/quality_status/cdc_source_lsn on bronze.br_patients"
          trino --server http://localhost:8080 --catalog iceberg --user data_engineer_pat \
              --execute "SELECT medical_record_number FROM bronze.br_patients LIMIT 1" \
              > /tmp/dataeng_phi.log 2>&1 \
            && fail "data_engineer should be denied medical_record_number, but the query succeeded: $(cat /tmp/dataeng_phi.log)"
          echo "data_engineer correctly scoped to operational metadata + surrogate keys, not PHI values"

          # clinical_user: full access.
          trino --server http://localhost:8080 --catalog iceberg --user clinical_user_bob \
            --execute "SELECT first_name, last_name, medical_record_number FROM bronze.br_patients LIMIT 1" > /dev/null \
            || fail "clinical_user should retain full access, including PHI columns"
          echo "clinical_user correctly retains full access"

          echo "Scenario 08 passed: minimum-necessary access control enforced as documented in governance/phi_classification.yml."

      - name: Rebuild the gold observability models against final state
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select gold --profiles-dir .

      - name: Assert observability models have sane shape AND correct values
        # Row-count-only assertions ("9 rows exist") would pass even if
        # every metric column were NULL or nonsensical — they prove the
        # models were created, not that they're right. These check actual
        # values, including some tied to specific scenarios already run
        # above, so a regression in the metric logic itself gets caught.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          lt100() { awk -v v="$1" 'BEGIN{ exit !(v + 0 < 100) }'; }

          for tbl in gold.cdc_freshness gold.cdc_volume_summary gold.current_quality_summary; do
            n=$(trino --server http://localhost:8080 --catalog iceberg \
                  --output-format CSV_UNQUOTED --execute "SELECT count(*) FROM $tbl" 2>/dev/null | tail -n1)
            [ "${n:-0}" = "9" ] || fail "$tbl: expected 9 dataset rows (one per bronze entity), got $n"
          done
          echo "shape OK: cdc_freshness, cdc_volume_summary, current_quality_summary each have 9 dataset rows"

          # cdc_freshness: lag/staleness must be non-negative for every
          # dataset - a negative value means a clock or join bug, not a
          # real reading.
          bad_freshness=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT count(*) FROM gold.cdc_freshness WHERE cdc_lag_seconds < 0 OR staleness_seconds < 0" 2>/dev/null | tail -n1)
          [ "${bad_freshness:-1}" = "0" ] || fail "cdc_freshness: $bad_freshness dataset(s) have negative lag/staleness"
          echo "cdc_freshness OK: lag and staleness are non-negative for every dataset"

          # cdc_volume_summary: raw events can never be fewer than current
          # rows (every current row descends from at least one raw event).
          # And scenario 01 (reliability-tests/01_duplicate_event.sql)
          # redelivered patient_id=2's identical event at the same LSN
          # twice, so patients must show at least 1 real duplicate.
          bad_volume=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT count(*) FROM gold.cdc_volume_summary WHERE raw_event_count < current_row_count" 2>/dev/null | tail -n1)
          [ "${bad_volume:-1}" = "0" ] || fail "cdc_volume_summary: $bad_volume dataset(s) have raw_event_count < current_row_count"
          patients_dup=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT duplicate_event_count FROM gold.cdc_volume_summary WHERE dataset = 'patients'" 2>/dev/null | tail -n1)
          [ "${patients_dup:-0}" -ge "1" ] 2>/dev/null || fail "cdc_volume_summary: expected patients.duplicate_event_count >= 1 (scenario 01's redelivery), got $patients_dup"
          # The four rates are defined to sum to ~100% (see the model's own
          # docstring) - verify that's actually true for one real row,
          # rather than just trusting the arithmetic by inspection.
          patients_rate_sum=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT duplicate_rate_pct + insert_rate_pct + update_rate_pct + delete_rate_pct FROM gold.cdc_volume_summary WHERE dataset = 'patients'" 2>/dev/null | tail -n1)
          awk -v v="${patients_rate_sum:-0}" 'BEGIN{ if (v < 99.5 || v > 100.5) exit 1 }' \
            || fail "cdc_volume_summary: expected the 4 rate columns to sum to ~100% for patients, got $patients_rate_sum"
          echo "cdc_volume_summary OK: raw >= current everywhere, scenario 01's redelivery shows up as a real duplicate, and the 4 rates sum to ~100%"

          # current_quality_summary: pass rate must be a valid percentage
          # everywhere, and diagnoses/lab_results specifically must be
          # BELOW 100% - scenarios 05/06/07 put real FAIL rows into their
          # current population.
          bad_passrate=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT count(*) FROM gold.current_quality_summary WHERE current_pass_rate_pct < 0 OR current_pass_rate_pct > 100" 2>/dev/null | tail -n1)
          [ "${bad_passrate:-1}" = "0" ] || fail "current_quality_summary: $bad_passrate dataset(s) have an out-of-range pass rate"
          diagnoses_rate=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT current_pass_rate_pct FROM gold.current_quality_summary WHERE dataset = 'diagnoses'" 2>/dev/null | tail -n1)
          lab_rate=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT current_pass_rate_pct FROM gold.current_quality_summary WHERE dataset = 'lab_results'" 2>/dev/null | tail -n1)
          lt100 "${diagnoses_rate:-100}" || fail "current_quality_summary: expected diagnoses pass rate < 100% (scenario 05's quarantined row), got $diagnoses_rate"
          lt100 "${lab_rate:-100}"       || fail "current_quality_summary: expected lab_results pass rate < 100% (scenarios 06+07's quarantined rows), got $lab_rate"
          echo "current_quality_summary OK: valid percentages, and the real quarantined rows from scenarios 05-07 show up"

          echo "Observability models validated on actual values, not just row-count shape."

      - name: Assert record_lineage traces the scenario 05 incident end-to-end
        # Demonstrates the actual "why is this record in the state it's in"
        # investigation gold.record_lineage exists for: scenario 05
        # (invalid_patient_reference) put diagnosis_id=9002 into quarantine.
        # Trace it from CDC event through to that outcome. We only use
        # diagnosis_id here to look up *which* record_token to check - the
        # same natural key already used by the scenario-05 assertion above
        # - so the actual investigation query (the one on record_lineage)
        # runs on record_token/operational metadata alone, no PHI value,
        # which is what makes it safe for the analyst/ai_agent tier. Scoping
        # to this one record_token (rather than counting/filtering the
        # whole dataset) keeps the assertion about scenario 05's record
        # specifically, not coupled to how many other rows happen to be
        # quarantined dataset-wide.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "record_lineage: could not resolve scenario 05's record_token (diagnosis_id=9002 missing from br_diagnoses)"
          trace=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT quality_status, failed_checks, is_trusted, is_quarantined, cdc_operation FROM gold.record_lineage WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          echo "record_lineage trace for scenario 05's record: $trace"
          case "$trace" in
            FAIL,*patient_not_found*,false,true,c) ;;
            *) fail "record_lineage: expected FAIL/patient_not_found/not-trusted/quarantined/insert for the scenario 05 record, got: $trace" ;;
          esac
          echo "record_lineage OK: scenario 05's incident (invalid patient reference) traces end-to-end from CDC event to quarantine."

      - name: Assert record_lineage_event logged scenario 05's quarantine decision
        # The "Rebuild the gold observability models against final state"
        # step above was record_lineage_event's FIRST build this run, so it
        # seeded from current_state - which by then already includes
        # scenario 05's quarantine. This is the "before" half of the
        # before/after scenario 13 (below) demonstrates; asserted separately
        # so a failure here points at seeding, not at the append logic.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "record_lineage_event: could not resolve scenario 05's record_token"
          n=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT count(*) FROM gold.record_lineage_event WHERE record_token = '$record_token' AND quality_status = 'FAIL' AND is_quarantined = true" 2>/dev/null | tail -n1)
          [ "${n:-0}" = "1" ] || fail "record_lineage_event: expected exactly 1 logged FAIL/quarantined entry for scenario 05's record, got $n"
          echo "record_lineage_event OK: scenario 05's quarantine decision is logged."

      - name: Run scenario 13 (corrected referential integrity) against Iceberg
        run: trino --server http://localhost:8080 --catalog iceberg -f reliability-tests/13_quarantine_correction.sql

      - name: Re-run the pipeline for the correction (scenario 13)
        working-directory: warehouse
        run: |
          ../.venv/bin/dbt run --select \
            br_patients sl_patients trusted_patients quarantine_patients \
            br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses \
            gold --profiles-dir .

      - name: Assert scenario 13's outcome - quarantine to trusted, both retained in history
        # The actual point of record_lineage_event: record_lineage (current
        # state) can only ever show ONE of these two facts at a time; this
        # assertion is only meaningful because record_lineage_event retains
        # BOTH, from two separate dbt runs, for the same record_token.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "scenario 13: could not resolve diagnosis_id=9002's record_token"

          current=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT quality_status, is_trusted, is_quarantined FROM gold.record_lineage WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          [ "$current" = "PASS,true,false" ] || fail "scenario 13: expected record_lineage to now show PASS/trusted/not-quarantined for the corrected record, got: $current"
          echo "record_lineage OK: current state flipped to PASS/trusted after the correction (this is all record_lineage alone can show)."

          history_n=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT count(*) FROM gold.record_lineage_event WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          [ "${history_n:-0}" -ge "2" ] 2>/dev/null || fail "scenario 13: expected record_lineage_event to retain at least 2 decisions for this record_token (quarantine then trusted), got $history_n"

          history=$(trino --server http://localhost:8080 --catalog iceberg \
            --output-format CSV_UNQUOTED --execute \
            "SELECT array_join(array_agg(quality_status || '/' || cast(is_trusted as varchar) || '/' || cast(is_quarantined as varchar) ORDER BY logged_at), ' -> ') FROM gold.record_lineage_event WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          echo "record_lineage_event history for this record_token: $history"
          case "$history" in
            *"FAIL/false/true"*"PASS/true/false"*) ;;
            *) fail "record_lineage_event: expected the FAIL/quarantined decision to precede the PASS/trusted one in history, got: $history" ;;
          esac
          echo "record_lineage_event OK: the incident timeline record_lineage alone can't show - quarantine, then correction, then trusted - is intact."

      - name: Collect diagnostics on failure
        # A bare "job failed" with no logs is useless for triaging a
        # multi-service pipeline. Every service's log, plus dbt's own log,
        # goes to an uploaded artifact — not just workflow console output,
        # which is easy to miss and gets truncated.
        if: failure()
        run: |
          mkdir -p artifacts
          ( cd infra-setup && docker compose logs --no-color ) > artifacts/docker-compose-all.log 2>&1 || true
          for svc in db debezium-iceberg trino lakekeeper minio metabase; do
            ( cd infra-setup && docker compose logs --no-color "$svc" ) > "artifacts/${svc}.log" 2>&1 || true
          done
          cp warehouse/logs/dbt.log artifacts/dbt.log 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: always()
        working-directory: infra-setup
        run: docker compose down -v
