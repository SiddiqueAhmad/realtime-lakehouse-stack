name: E2E pipeline reliability (best-effort)

# Runs the full Postgres -> Debezium -> DuckDB/DuckLake pipeline via docker
# compose and asserts reliability-tests/ scenarios 01-07 and 13 through the
# actual bronze/silver/quality layers, not just at the Postgres source. See
# reliability-tests/README.md for what each scenario claims.
#
# Deliberately NOT gating every PR (workflow_dispatch + nightly only): this
# stands up Postgres and Debezium from cold and waits on Debezium's initial
# snapshot landing in warehouse.raw_cdc, which is slow and has more moving
# parts than the fast Postgres-only job in ci.yml.
#
# ARCHITECTURE NOTE: this workflow was rewritten to replace
# Trino/Iceberg/Lakekeeper/MinIO with DuckDB + the `ducklake` extension
# (self-hosted, Postgres-backed catalog — see warehouse/profiles.yml) and
# Debezium's JDBC sink (writing straight to warehouse.raw_cdc.* — see
# infra-setup/debezium-server-conf/) in place of its Iceberg sink. The
# session that wrote this had no route to Docker Hub/quay.io or
# extensions.duckdb.org, so none of it could be exercised end-to-end where
# this was written — but GitHub Actions runners do have that access, and
# real runs here have already driven out and fixed several wrong
# assumptions in turn: a bad Maven coordinate for the JDBC sink jar; then
# (wrongly) assuming the stock image needed no sink jars added at all
# ("No Debezium consumer named 'jdbc' is available" said otherwise, for
# real); now installing the actual debezium-server-dist distribution
# instead (see debezium-server-conf/Dockerfile). Treat each run as
# still-settling validation, not as already-proven; expect further
# iteration until it's green.
#
# Also dropped in this migration: scenario 08 (minimum-necessary PHI access
# control). Trino's file-based rules.json enforced the role -> access matrix
# in governance/phi_classification.yml at query time; DuckDB is an
# embedded, single-process engine with no equivalent. That file now
# documents the intended policy without enforcing it — a real gap, not
# something quietly dropped. See its own KNOWN GAP note.
#
# No production secret of any kind is used here: RECORD_TOKEN_HMAC_KEY is
# generated fresh per run (openssl rand), and every other credential is the
# synthetic stack's own hardcoded dev value (testuser/testpass, ...),
# matching infra-setup/docker-compose.yml. On failure, every service's logs
# (plus dbt's own log) are uploaded as a build artifact rather than left to
# scroll off the console.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # nightly

jobs:
  e2e-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dbt + deps
        # dbt-duckdb and duckdb (the Python package infra-setup/scripts/dq.py
        # also uses) are both project dependencies — see pyproject.toml.
        run: uv sync

      - name: Generate a CI-only lineage HMAC key
        # Real RECORD_TOKEN_HMAC_KEY, generated fresh per run and never
        # logged or persisted — not the insecure dev fallback documented in
        # warehouse/duckdb_plugins/lineage_udfs.py. Written to $GITHUB_ENV so
        # every later step (dbt run, dq.py) picks it up automatically. No
        # production secret of any kind is used anywhere in this workflow.
        run: echo "RECORD_TOKEN_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start the stack
        working-directory: infra-setup
        # Real run (33249260789): the debezium image build finally
        # succeeded, but `docker compose up -d` itself then failed - the
        # one-shot warehouse-db-init service (runs
        # timescale/warehouse-db-init.sql via psql - see that service's
        # own definition) exited 2, which is psql's "connection to server
        # failed" code, not a SQL error. Its own stdout/stderr only goes to
        # the on-failure diagnostics artifact (blocked download in this
        # session, same as elsewhere) - dump it inline on failure so the
        # real message is visible without that.
        run: |
          if docker compose up -d; then
            exit 0
          fi
          echo "::error::docker compose up -d failed"
          echo "::group::docker compose logs warehouse-db-init"
          docker compose logs --no-color warehouse-db-init || true
          echo "::endgroup::"
          echo "::group::docker compose ps -a"
          docker compose ps -a || true
          echo "::endgroup::"
          exit 1

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=testpass pg_isready -h localhost -p 5433 -U testuser -d ehr > /dev/null 2>&1; then
              echo "Postgres is up"
              exit 0
            fi
            echo "waiting for Postgres... ($i/30)"
            sleep 3
          done
          echo "::error::Postgres did not become ready in time"
          exit 1

      - name: Verify DuckDB/DuckLake connectivity
        # Unlike Trino, there's no separate server process to wait on here —
        # dq.py opens its own embedded DuckDB connection and attaches the
        # ducklake/postgres databases itself on every invocation (see that
        # script). This step exists to fail fast with a clear message if
        # that first attach doesn't work (extension download hiccup, the
        # `warehouse` database not created yet by warehouse-db-init), rather
        # than have the real failure surface confusingly on scenario 01.
        run: |
          for i in $(seq 1 10); do
            if .venv/bin/python3 infra-setup/scripts/dq.py "SELECT 1" > /dev/null 2>/tmp/dq_probe.log; then
              echo "DuckDB/DuckLake attach OK"
              exit 0
            fi
            echo "waiting for DuckLake catalog to be attachable... ($i/10)"
            sleep 5
          done
          echo "::error::Could not attach the DuckLake/raw_cdc databases in time"
          cat /tmp/dq_probe.log
          exit 1

      - name: Wait for Debezium's initial snapshot to land in raw_cdc
        # 4 seed patients (see infra-setup/timescale/healthcare.sql) is the
        # known-good row count for a clean start.
        #
        # Piping dq.py through `tail -n1` swallows its exit code (the
        # pipeline's status is tail's, not python's) - a genuine dq.py
        # failure (e.g. raw_cdc.patients doesn't exist yet - the JDBC sink
        # hasn't created it, or errored) would otherwise silently read as
        # "0 rows" forever instead of surfacing. Capture stdout/stderr to
        # files instead so a real failure is visible, not masked.
        run: |
          for i in $(seq 1 60); do
            # `if cmd; then` is deliberate, not decorative: this step runs
            # under `bash -e` (the GitHub Actions default), which aborts
            # the whole script the instant any bare, unguarded command
            # fails - rc=$? on the next line would never even run. Wrapping
            # the call as an if-condition is one of the few constructs -e
            # exempts from that, so a real dq.py failure is something this
            # loop can see and retry on, not something that silently kills
            # the step with no output (which is exactly what happened on
            # the previous run: instant failure, zero lines of diagnostic
            # output, before this fix).
            if .venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.patients" \
                  > /tmp/dq_out.log 2> /tmp/dq_err.log; then
              rc=0
            else
              rc=$?
            fi
            n=$(tail -n1 /tmp/dq_out.log)
            if [ $rc -eq 0 ] && [ "${n:-0}" -ge "4" ] 2>/dev/null; then
              echo "snapshot landed ($n rows)"
              exit 0
            fi
            if [ $rc -ne 0 ]; then
              echo "dq.py failed ($i/60), retrying:"
              cat /tmp/dq_err.log
            else
              echo "waiting for CDC snapshot... ($i/60, currently $n rows)"
            fi
            sleep 10
          done
          echo "::error::Debezium's initial snapshot did not land in time"
          echo "::group::final dq.py error"
          cat /tmp/dq_err.log
          echo "::endgroup::"
          echo "::group::docker compose logs debezium"
          ( cd infra-setup && docker compose logs --no-color debezium ) || true
          echo "::endgroup::"
          echo "::group::docker compose logs db"
          ( cd infra-setup && docker compose logs --no-color db ) || true
          echo "::endgroup::"
          exit 1

      - name: dbt seed + run + test
        working-directory: warehouse
        run: |
          ../.venv/bin/dbt seed --profiles-dir .
          ../.venv/bin/dbt run  --profiles-dir .
          ../.venv/bin/dbt test --profiles-dir .

      - name: Run scenario 01 (duplicate event) directly against raw_cdc
        # Postgres-native — inserts straight into the raw CDC table, so
        # there's no Debezium delivery to wait on before the first dbt run
        # below.
        run: PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d warehouse -v ON_ERROR_STOP=1 -f reliability-tests/01_duplicate_event.sql

      - name: Re-run bronze/silver for patients (redelivery merge #1)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_patients sl_patients --profiles-dir .

      - name: Assert scenario 01's outcome through the actual reliability engine
        run: |
          result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) || ',' || max_by(email, cdc_source_lsn) FROM bronze.br_patients WHERE patient_id = 2" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_patients result: $result"
          expected="1,morgan.sample+updated@synthetic.test"
          if [ "$result" != "$expected" ]; then
            echo "::error::Expected exactly 1 row with the updated email (redelivery of the identical event should be a no-op), got: $result"
            exit 1
          fi
          echo "Scenario 01 passed through the real raw_cdc -> dbt bronze reliability engine."

      - name: Run scenario 02 (transaction order) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/02_transaction_order.sql

      - name: Wait for Debezium to stream the transaction's events
        run: |
          for i in $(seq 1 30); do
            patients_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.patients WHERE patient_id = 1" \
                  2>/dev/null | tail -n1 || echo 0)
            encounters_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.encounters WHERE encounter_id = 2" \
                  2>/dev/null | tail -n1 || echo 0)
            # 1 snapshot row + 2 UPDATE events each.
            if [ "${patients_n:-0}" -ge "3" ] 2>/dev/null && [ "${encounters_n:-0}" -ge "3" ] 2>/dev/null; then
              echo "transaction events landed (patients=$patients_n, encounters=$encounters_n)"
              exit 0
            fi
            echo "waiting for CDC events... ($i/30, patients=$patients_n, encounters=$encounters_n)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenario 02's CDC events to land (patients=${patients_n:-0}, encounters=${encounters_n:-0})"
          exit 1

      - name: Re-run bronze/silver for patients and encounters
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_patients sl_patients br_encounters sl_encounters --profiles-dir .

      - name: Assert scenario 02's outcome through the actual reliability engine
        run: |
          patients_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) || ',' || max_by(phone, cdc_source_lsn) FROM bronze.br_patients WHERE medical_record_number = 'MRN-SYN-00001'" \
                     2>/dev/null | tail -n1)
          encounters_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) || ',' || max_by(status, cdc_source_lsn) FROM bronze.br_encounters WHERE encounter_id = 2" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_patients result: $patients_result"
          echo "bronze.br_encounters result: $encounters_result"
          ok=true
          [ "$patients_result" = "1,555-010-9902" ] || { echo "::error::patients: expected 1,555-010-9902 got $patients_result"; ok=false; }
          [ "$encounters_result" = "1,finished" ] || { echo "::error::encounters: expected 1,finished got $encounters_result"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 02 passed end-to-end through Postgres -> Debezium -> raw_cdc -> dbt bronze."

      - name: Run scenario 03 (out-of-order replay) directly against raw_cdc
        run: PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d warehouse -v ON_ERROR_STOP=1 -f reliability-tests/03_out_of_order_replay.sql

      - name: Re-run bronze/silver for lab_results
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_lab_results sl_lab_results --profiles-dir .

      - name: Assert scenario 03's outcome
        run: |
          result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT result_value, cdc_source_lsn FROM bronze.br_lab_results WHERE lab_result_id = 9001" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_lab_results result: $result"
          if [ "$result" != "4.2,900000002" ]; then
            echo "::error::Expected the higher-LSN (4.2) value to win over the lower-LSN out-of-order replay, got: $result"
            exit 1
          fi
          echo "Scenario 03 passed: the out-of-order (lower-LSN) event was correctly a no-op."

      - name: Run scenario 04 (deleted diagnosis) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/04_deleted_diagnosis.sql

      - name: Wait for Debezium to stream the delete event
        run: |
          for i in $(seq 1 30); do
            n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.diagnoses WHERE diagnosis_id = 3 AND __op = 'd'" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "1" ] 2>/dev/null; then
              echo "delete event landed"
              exit 0
            fi
            echo "waiting for CDC delete event... ($i/30)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenario 04's CDC delete event to land"
          exit 1

      - name: Re-run bronze/silver/quality for diagnoses (scenario 04)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses --profiles-dir .

      - name: Assert scenario 04's outcome
        run: |
          bronze_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT is_deleted, cdc_operation FROM bronze.br_diagnoses WHERE diagnosis_id = 3" \
                     2>/dev/null | tail -n1)
          silver_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) FROM silver.sl_diagnoses WHERE diagnosis_id = 3" \
                     2>/dev/null | tail -n1)
          echo "bronze.br_diagnoses result: $bronze_result, silver row count: $silver_n"
          ok=true
          [ "$bronze_result" = "true,d" ] || { echo "::error::bronze: expected true,d (retained with is_deleted, audit trail preserved) got $bronze_result"; ok=false; }
          [ "${silver_n:-1}" = "0" ] || { echo "::error::silver: expected the deleted row excluded (0 rows) got $silver_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 04 passed: delete retained as an audit trail in bronze, excluded downstream."

      - name: Run scenario 05 (invalid patient reference) directly against raw_cdc
        run: PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d warehouse -v ON_ERROR_STOP=1 -f reliability-tests/05_invalid_patient_reference.sql

      - name: Re-run bronze/silver/quality for diagnoses (scenario 05)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses --profiles-dir .

      - name: Assert scenario 05's outcome (also covers scenario 09 - quarantine split)
        run: |
          silver_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT quality_status, failed_checks FROM silver.sl_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          trusted_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) FROM quality.trusted_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          quarantine_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) FROM quality.quarantine_diagnoses WHERE diagnosis_id = 9002" \
                     2>/dev/null | tail -n1)
          echo "silver: $silver_result, trusted: $trusted_n, quarantine: $quarantine_n"
          ok=true
          case "$silver_result" in FAIL,*patient_not_found*) ;; *) echo "::error::silver: expected FAIL with patient_not_found, got $silver_result"; ok=false ;; esac
          [ "${trusted_n:-1}" = "0" ] || { echo "::error::trusted_diagnoses should not contain the orphaned row, got count=$trusted_n"; ok=false; }
          [ "${quarantine_n:-0}" = "1" ] || { echo "::error::quarantine_diagnoses should contain exactly the orphaned row, got count=$quarantine_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenario 05 passed: referential integrity gate quarantined the orphaned row."

      - name: Run scenarios 06+07 (impossible value, missing field) against the live Postgres source
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/06_impossible_lab_value.sql
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr \
            -v ON_ERROR_STOP=1 -f reliability-tests/07_missing_required_field.sql

      - name: Wait for Debezium to stream both new lab results
        run: |
          for i in $(seq 1 30); do
            n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.lab_results WHERE result_value = 55.0 OR (loinc_code = '2345-7' AND result_value IS NULL)" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "2" ] 2>/dev/null; then
              echo "both events landed ($n rows)"
              exit 0
            fi
            echo "waiting for CDC events... ($i/30, currently $n rows)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenarios 06+07's CDC events to land (only $n/2 rows present)"
          exit 1

      - name: Re-run bronze/silver/quality for lab_results (scenarios 06+07)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_lab_results sl_lab_results trusted_lab_results quarantine_lab_results --profiles-dir .

      - name: Assert scenarios 06+07's outcome
        run: |
          impossible_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT quality_status, failed_checks FROM silver.sl_lab_results WHERE result_value = 55.0" \
                     2>/dev/null | tail -n1)
          missing_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT quality_status, failed_checks FROM silver.sl_lab_results WHERE loinc_code = '2345-7' AND result_value IS NULL" \
                     2>/dev/null | tail -n1)
          quarantine_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                     "SELECT count(*) FROM quality.quarantine_lab_results WHERE result_value = 55.0 OR (loinc_code = '2345-7' AND result_value IS NULL)" \
                     2>/dev/null | tail -n1)
          echo "impossible value: $impossible_result, missing field: $missing_result, quarantined: $quarantine_n"
          ok=true
          case "$impossible_result" in FAIL,*result_out_of_range*) ;; *) echo "::error::scenario 06: expected FAIL with result_out_of_range, got $impossible_result"; ok=false ;; esac
          case "$missing_result" in FAIL,*missing_result_value*) ;; *) echo "::error::scenario 07: expected FAIL with missing_result_value, got $missing_result"; ok=false ;; esac
          [ "${quarantine_n:-0}" = "2" ] || { echo "::error::expected both rows quarantined, got count=$quarantine_n"; ok=false; }
          [ "$ok" = "true" ] || exit 1
          echo "Scenarios 06+07 passed: clinical plausibility and completeness gates quarantined both rows."

      - name: Rebuild the gold observability models against final state
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select gold --profiles-dir .

      - name: Assert observability models have sane shape AND correct values
        # Row-count-only assertions ("9 rows exist") would pass even if
        # every metric column were NULL or nonsensical — they prove the
        # models were created, not that they're right. These check actual
        # values, including some tied to specific scenarios already run
        # above, so a regression in the metric logic itself gets caught.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          lt100() { awk -v v="$1" 'BEGIN{ exit !(v + 0 < 100) }'; }

          for tbl in gold.cdc_freshness gold.cdc_volume_summary gold.current_quality_summary; do
            n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM $tbl" 2>/dev/null | tail -n1)
            [ "${n:-0}" = "9" ] || fail "$tbl: expected 9 dataset rows (one per bronze entity), got $n"
          done
          echo "shape OK: cdc_freshness, cdc_volume_summary, current_quality_summary each have 9 dataset rows"

          # cdc_freshness: lag/staleness must be non-negative for every
          # dataset - a negative value means a clock or join bug, not a
          # real reading.
          bad_freshness=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.cdc_freshness WHERE cdc_lag_seconds < 0 OR staleness_seconds < 0" 2>/dev/null | tail -n1)
          [ "${bad_freshness:-1}" = "0" ] || fail "cdc_freshness: $bad_freshness dataset(s) have negative lag/staleness"
          echo "cdc_freshness OK: lag and staleness are non-negative for every dataset"

          # cdc_volume_summary: raw events can never be fewer than current
          # rows (every current row descends from at least one raw event).
          # And scenario 01 (reliability-tests/01_duplicate_event.sql)
          # redelivered patient_id=2's identical event at the same LSN
          # twice, so patients must show at least 1 real duplicate.
          bad_volume=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.cdc_volume_summary WHERE raw_event_count < current_row_count" 2>/dev/null | tail -n1)
          [ "${bad_volume:-1}" = "0" ] || fail "cdc_volume_summary: $bad_volume dataset(s) have raw_event_count < current_row_count"
          patients_dup=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT duplicate_event_count FROM gold.cdc_volume_summary WHERE dataset = 'patients'" 2>/dev/null | tail -n1)
          [ "${patients_dup:-0}" -ge "1" ] 2>/dev/null || fail "cdc_volume_summary: expected patients.duplicate_event_count >= 1 (scenario 01's redelivery), got $patients_dup"
          # The four rates are defined to sum to ~100% (see the model's own
          # docstring) - verify that's actually true for one real row,
          # rather than just trusting the arithmetic by inspection.
          patients_rate_sum=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT duplicate_rate_pct + insert_rate_pct + update_rate_pct + delete_rate_pct FROM gold.cdc_volume_summary WHERE dataset = 'patients'" 2>/dev/null | tail -n1)
          awk -v v="${patients_rate_sum:-0}" 'BEGIN{ if (v < 99.5 || v > 100.5) exit 1 }' \
            || fail "cdc_volume_summary: expected the 4 rate columns to sum to ~100% for patients, got $patients_rate_sum"
          echo "cdc_volume_summary OK: raw >= current everywhere, scenario 01's redelivery shows up as a real duplicate, and the 4 rates sum to ~100%"

          # current_quality_summary: pass rate must be a valid percentage
          # everywhere, and diagnoses/lab_results specifically must be
          # BELOW 100% - scenarios 05/06/07 put real FAIL rows into their
          # current population.
          bad_passrate=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.current_quality_summary WHERE current_pass_rate_pct < 0 OR current_pass_rate_pct > 100" 2>/dev/null | tail -n1)
          [ "${bad_passrate:-1}" = "0" ] || fail "current_quality_summary: $bad_passrate dataset(s) have an out-of-range pass rate"
          diagnoses_rate=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT current_pass_rate_pct FROM gold.current_quality_summary WHERE dataset = 'diagnoses'" 2>/dev/null | tail -n1)
          lab_rate=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT current_pass_rate_pct FROM gold.current_quality_summary WHERE dataset = 'lab_results'" 2>/dev/null | tail -n1)
          lt100 "${diagnoses_rate:-100}" || fail "current_quality_summary: expected diagnoses pass rate < 100% (scenario 05's quarantined row), got $diagnoses_rate"
          lt100 "${lab_rate:-100}"       || fail "current_quality_summary: expected lab_results pass rate < 100% (scenarios 06+07's quarantined rows), got $lab_rate"
          echo "current_quality_summary OK: valid percentages, and the real quarantined rows from scenarios 05-07 show up"

          echo "Observability models validated on actual values, not just row-count shape."

      - name: Assert record_lineage traces the scenario 05 incident end-to-end
        # Demonstrates the actual "why is this record in the state it's in"
        # investigation gold.record_lineage exists for: scenario 05
        # (invalid_patient_reference) put diagnosis_id=9002 into quarantine.
        # Trace it from CDC event through to that outcome. We only use
        # diagnosis_id here to look up *which* record_token to check - the
        # same natural key already used by the scenario-05 assertion above
        # - so the actual investigation query (the one on record_lineage)
        # runs on record_token/operational metadata alone, no PHI value,
        # which is what makes it safe for the analyst/ai_agent tier. Scoping
        # to this one record_token (rather than counting/filtering the
        # whole dataset) keeps the assertion about scenario 05's record
        # specifically, not coupled to how many other rows happen to be
        # quarantined dataset-wide.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "record_lineage: could not resolve scenario 05's record_token (diagnosis_id=9002 missing from br_diagnoses)"
          trace=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT quality_status, failed_checks, is_trusted, is_quarantined, cdc_operation FROM gold.record_lineage WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          echo "record_lineage trace for scenario 05's record: $trace"
          case "$trace" in
            FAIL,*patient_not_found*,false,true,c) ;;
            *) fail "record_lineage: expected FAIL/patient_not_found/not-trusted/quarantined/insert for the scenario 05 record, got: $trace" ;;
          esac
          echo "record_lineage OK: scenario 05's incident (invalid patient reference) traces end-to-end from CDC event to quarantine."

      - name: Assert record_lineage_event logged scenario 05's quarantine decision
        # The "Rebuild the gold observability models against final state"
        # step above was record_lineage_event's FIRST build this run, so it
        # seeded from current_state - which by then already includes
        # scenario 05's quarantine. This is the "before" half of the
        # before/after scenario 13 (below) demonstrates; asserted separately
        # so a failure here points at seeding, not at the append logic.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "record_lineage_event: could not resolve scenario 05's record_token"
          n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.record_lineage_event WHERE record_token = '$record_token' AND quality_status = 'FAIL' AND is_quarantined = true" 2>/dev/null | tail -n1)
          [ "${n:-0}" = "1" ] || fail "record_lineage_event: expected exactly 1 logged FAIL/quarantined entry for scenario 05's record, got $n"
          echo "record_lineage_event OK: scenario 05's quarantine decision is logged."

      - name: Assert record_lineage_event logged scenario 04's deletion
        # Direct proof for the DELETED quality_status path (see
        # record_lineage_event.sql's own comment): scenario 04's diagnosis
        # is deleted, so record_lineage's quality_status for it is null by
        # design - this asserts record_lineage_event still logs a real,
        # well-defined decision for it rather than silently producing a
        # null-fingerprinted row (which is what the "Re-run the full test
        # suite" step's not_null tests would catch anyway, but this pins
        # down the actual expected value, not just "it's not null").
        # diagnosis_id=3 is seed data, not inserted by this scenario - it
        # already had a logged decision (whatever the seed run computed)
        # before the delete, so decision_transition's PRIOR half isn't
        # pinned down here, only that it correctly ends at DELETED.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 3" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "record_lineage_event: could not resolve scenario 04's record_token"
          row=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT quality_status, decision_transition, (decision_fingerprint IS NOT NULL) FROM gold.record_lineage_event WHERE record_token = '$record_token' AND quality_status = 'DELETED'" 2>/dev/null | tail -n1)
          case "$row" in
            "DELETED,"*"-> DELETED,true") ;;
            *) fail "record_lineage_event: expected a DELETED row ending 'decision_transition ... -> DELETED' with a non-null fingerprint for scenario 04's deleted record, got: $row" ;;
          esac
          echo "record_lineage_event OK: scenario 04's deletion is logged as a well-defined DELETED decision, not a null fingerprint. ($row)"

      - name: Run scenario 13 (corrected referential integrity) against raw_cdc
        run: PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d warehouse -v ON_ERROR_STOP=1 -f reliability-tests/13_quarantine_correction.sql

      - name: Re-run the pipeline for the correction (scenario 13)
        working-directory: warehouse
        run: |
          ../.venv/bin/dbt run --select \
            br_patients sl_patients trusted_patients quarantine_patients \
            br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses \
            gold --profiles-dir .

      - name: Assert scenario 13's outcome - quarantine to trusted, both retained in history
        # The actual point of record_lineage_event: record_lineage (current
        # state) can only ever show ONE of these two facts at a time; this
        # assertion is only meaningful because record_lineage_event retains
        # BOTH, from two separate dbt runs, for the same record_token.
        run: |
          fail() { echo "::error::$1"; exit 1; }
          record_token=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT record_token FROM bronze.br_diagnoses WHERE diagnosis_id = 9002" 2>/dev/null | tail -n1)
          [ -n "$record_token" ] || fail "scenario 13: could not resolve diagnosis_id=9002's record_token"

          current=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT quality_status, is_trusted, is_quarantined FROM gold.record_lineage WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          [ "$current" = "PASS,true,false" ] || fail "scenario 13: expected record_lineage to now show PASS/trusted/not-quarantined for the corrected record, got: $current"
          echo "record_lineage OK: current state flipped to PASS/trusted after the correction (this is all record_lineage alone can show)."

          history_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.record_lineage_event WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          [ "${history_n:-0}" -ge "2" ] 2>/dev/null || fail "scenario 13: expected record_lineage_event to retain at least 2 decisions for this record_token (quarantine then trusted), got $history_n"

          history=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT string_agg(quality_status || '/' || cast(is_trusted as varchar) || '/' || cast(is_quarantined as varchar), ' -> ' ORDER BY event_sequence) FROM gold.record_lineage_event WHERE record_token = '$record_token'" 2>/dev/null | tail -n1)
          echo "record_lineage_event history for this record_token: $history"
          case "$history" in
            *"FAIL/false/true"*"PASS/true/false"*) ;;
            *) fail "record_lineage_event: expected the FAIL/quarantined decision to precede the PASS/trusted one in history, got: $history" ;;
          esac
          echo "record_lineage_event OK: the incident timeline record_lineage alone can't show - quarantine, then correction, then trusted - is intact."

          # decision_transition/previous_decision_fingerprint exist so this
          # exact "what changed" question is a plain column read on the
          # PASS/trusted row, not a self-join a caller has to write - assert
          # that's actually true for scenario 13's own correction, not just
          # for a scratch fixture.
          transition=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT decision_transition FROM gold.record_lineage_event WHERE record_token = '$record_token' AND quality_status = 'PASS'" 2>/dev/null | tail -n1)
          [ "$transition" = "FAIL/quarantined -> PASS/trusted" ] || fail "record_lineage_event: expected decision_transition 'FAIL/quarantined -> PASS/trusted' for the corrected record, got: $transition"

          fp_check=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.record_lineage_event q WHERE q.record_token = '$record_token' AND q.quality_status = 'PASS' AND q.previous_decision_fingerprint = (SELECT decision_fingerprint FROM gold.record_lineage_event WHERE record_token = '$record_token' AND quality_status = 'FAIL')" 2>/dev/null | tail -n1)
          [ "${fp_check:-0}" = "1" ] || fail "record_lineage_event: expected the PASS row's previous_decision_fingerprint to equal the FAIL row's own decision_fingerprint, got count=$fp_check"
          echo "record_lineage_event OK: decision_transition and previous_decision_fingerprint correctly read the quarantine -> trusted correction off a single row."

      - name: Re-run the full test suite (post scenario-13 regression check)
        # Scenario 13 is the one scenario in this workflow whose correction
        # changes a record's logged decision WITHOUT touching that record's
        # own bronze row (only the referenced patient row is new - see
        # 13_quarantine_correction.sql's own comment). That's exactly the
        # condition that once let gold.record_lineage_event mint a
        # duplicate ledger_key silently: pipeline_run_id (previously part
        # of ledger_key) is inherited from bronze at merge time, so a
        # second ledger entry for the same record_token, appended while its
        # own bronze row is unchanged, could carry the same pipeline_run_id
        # as the first - and dbt test only ran once, before any scenario
        # had executed, so gold.yml's unique test on ledger_key never got a
        # chance to see the collision. Fixed by keying ledger_key on
        # event_sequence (record_lineage_event.sql's own per-record_token
        # counter) instead - but the fix is only worth anything if this
        # workflow actually re-tests after the one scenario that can
        # trigger it, so it does now.
        working-directory: warehouse
        run: ../.venv/bin/dbt test --profiles-dir .

      - name: Capture scenario 10's pre-replay snapshot (pipeline replay)
        # reliability-tests/10_pipeline_replay.md, automated: a plain re-run
        # of dbt with no new source writes must be a no-op on the data.
        #
        # Row/event counts alone (gold.cdc_volume_summary) prove nothing
        # got added or dropped, but not that any surviving row's own
        # content is unchanged - a replay that reshuffled or corrupted
        # individual rows while preserving counts would still pass a
        # counts-only check. An earlier version of this hash covered only
        # a hand-picked subset of columns (record_token/source_event_id/
        # quality_status/is_trusted/is_quarantined, say) - which proved
        # "the columns I remembered to list are unchanged", not "the row is
        # unchanged": a column left out of the list (pipeline_run_id,
        # decision_transition, logged_at, ...) could differ silently and
        # the hash would never notice. `t::varchar` (t being the FROM
        # alias) casts the ENTIRE row to its struct representation - every
        # column, automatically, with no list to fall out of sync with the
        # model's actual schema - so sha256 over that is a genuine
        # byte-content comparison of the whole row, not a proxy over
        # whichever fields happened to get named. Safe to include every
        # column, logged_at included: record_lineage_event is a true
        # INSERT-only append (existing rows are never rewritten, so an
        # unchanged row's logged_at can't drift), and record_lineage's
        # pre_hook DELETE+full-reinsert reproduces byte-identical values
        # for every column as long as the underlying source data hasn't
        # changed - which is exactly what this scenario is asserting.
        run: |
          snapshot=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT string_agg(dataset || ':' || raw_event_count || ':' || current_row_count, ',' ORDER BY dataset) FROM gold.cdc_volume_summary" \
            2>/dev/null | tail -n1)
          echo "$snapshot" > /tmp/scenario10_volume_snapshot.txt

          lineage_hash=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT sha256(string_agg(t::varchar, chr(30) ORDER BY record_token)) FROM gold.record_lineage t" \
            2>/dev/null | tail -n1)
          echo "$lineage_hash" > /tmp/scenario10_lineage_hash.txt

          event_hash=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT sha256(string_agg(t::varchar, chr(30) ORDER BY record_token, event_sequence)) FROM gold.record_lineage_event t" \
            2>/dev/null | tail -n1)
          echo "$event_hash" > /tmp/scenario10_event_hash.txt

          echo "Captured pre-replay volume snapshot: $snapshot"
          echo "Captured pre-replay whole-row content hashes: record_lineage=$lineage_hash record_lineage_event=$event_hash"

      - name: Re-run the full pipeline with no new source writes (scenario 10 replay)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --profiles-dir .

      - name: Assert scenario 10's outcome - a plain replay is a no-op on the data
        run: |
          fail() { echo "::error::$1"; exit 1; }
          snapshot_before=$(cat /tmp/scenario10_volume_snapshot.txt)
          snapshot_after=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT string_agg(dataset || ':' || raw_event_count || ':' || current_row_count, ',' ORDER BY dataset) FROM gold.cdc_volume_summary" \
            2>/dev/null | tail -n1)
          [ "$snapshot_after" = "$snapshot_before" ] || fail "scenario 10: bronze row/event counts changed on a no-op replay. Before: $snapshot_before After: $snapshot_after"

          lineage_hash_before=$(cat /tmp/scenario10_lineage_hash.txt)
          lineage_hash_after=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT sha256(string_agg(t::varchar, chr(30) ORDER BY record_token)) FROM gold.record_lineage t" \
            2>/dev/null | tail -n1)
          [ "$lineage_hash_after" = "$lineage_hash_before" ] || fail "scenario 10: gold.record_lineage's whole-row content hash changed on a no-op replay (before=$lineage_hash_before after=$lineage_hash_after) - every column of every row must be byte-identical, not just a hand-picked subset."

          event_hash_before=$(cat /tmp/scenario10_event_hash.txt)
          event_hash_after=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT sha256(string_agg(t::varchar, chr(30) ORDER BY record_token, event_sequence)) FROM gold.record_lineage_event t" \
            2>/dev/null | tail -n1)
          [ "$event_hash_after" = "$event_hash_before" ] || fail "scenario 10: gold.record_lineage_event's whole-row content hash changed on a no-op replay (before=$event_hash_before after=$event_hash_after) - a re-run with no source changes must not alter or manufacture ledger history, in any column."

          echo "Scenario 10 passed: dbt run with no new source writes is a true no-op, verified by a whole-row content hash - every column, not a hand-picked subset - across both current-state and ledger history."

      - name: Kill Debezium, then write a new diagnosis while it's down (scenario 11 setup)
        # reliability-tests/11_partial_cdc_failure.md, automated: rather than
        # racing a mid-flight kill (nondeterministic - Debezium may or may
        # not have already streamed the event by the time the kill lands),
        # kill it FIRST and write the new row while it's confirmed down.
        # That's a strictly harder, fully deterministic version of the same
        # claim: Postgres's logical replication slot (not Debezium) is what
        # retains unconsumed WAL, so the event must still be there,
        # untouched, whenever Debezium comes back - proving durability
        # doesn't depend on Debezium being up continuously.
        working-directory: infra-setup
        run: |
          docker kill debezium
          docker compose ps -a debezium
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d ehr -v ON_ERROR_STOP=1 -c \
            "INSERT INTO ehr.diagnoses (diagnosis_id, encounter_id, patient_id, icd10_code, description, diagnosed_at) VALUES (9003, 1, 1, 'M25.50', 'Pain in unspecified joint', now())"
          echo "Diagnosis 9003 written while debezium is down."

      - name: Restart Debezium (scenario 11 recovery)
        working-directory: infra-setup
        run: docker compose up -d debezium

      - name: Wait for the new diagnosis's CDC event to land after restart
        run: |
          for i in $(seq 1 30); do
            n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
                  "SELECT count(*) FROM raw.raw_cdc.diagnoses WHERE diagnosis_id = 9003" \
                  2>/dev/null | tail -n1 || echo 0)
            if [ "${n:-0}" -ge "1" ] 2>/dev/null; then
              echo "diagnosis 9003 landed after restart ($n row(s))"
              exit 0
            fi
            echo "waiting for Debezium to resume and stream diagnosis 9003... ($i/30)"
            sleep 5
          done
          echo "::error::Timed out waiting for scenario 11's post-restart CDC event to land"
          exit 1

      - name: Re-run bronze/silver/quality for diagnoses (scenario 11)
        working-directory: warehouse
        run: ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses --profiles-dir .

      - name: Assert scenario 11's outcome - resumed with no gap and no duplication
        run: |
          fail() { echo "::error::$1"; exit 1; }
          raw_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM raw.raw_cdc.diagnoses WHERE diagnosis_id = 9003" 2>/dev/null | tail -n1)
          [ "${raw_n:-0}" = "1" ] || fail "scenario 11: expected exactly 1 raw_cdc event for diagnosis 9003 after the kill/restart (no gap, no duplicate delivery), got $raw_n"

          bronze_result=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*), icd10_code FROM bronze.br_diagnoses WHERE diagnosis_id = 9003 GROUP BY icd10_code" 2>/dev/null | tail -n1)
          [ "$bronze_result" = "1,M25.50" ] || fail "scenario 11: expected bronze.br_diagnoses to show exactly 1 row with icd10_code=M25.50 for diagnosis 9003, got: $bronze_result"

          trusted_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM quality.trusted_diagnoses WHERE diagnosis_id = 9003" 2>/dev/null | tail -n1)
          [ "${trusted_n:-0}" = "1" ] || fail "scenario 11: expected diagnosis 9003 (a valid reference) in trusted_diagnoses, got count=$trusted_n"
          echo "Scenario 11 passed: Debezium resumed from its committed offset after being killed and restarted - the event written while it was down landed exactly once, with no gap and no duplication."

      - name: Set up scenario 14 (new pending decisions for concurrent writers to race on)
        # reliability-tests/14_ducklake_concurrent_writers.md, automated.
        # 5 fresh diagnoses (IDs unused by any other scenario), each
        # referencing a nonexistent patient - same referential-integrity
        # shape as scenario 5 - so each gets a genuine new FAIL/quarantined
        # decision that has never been logged in record_lineage_event.
        run: |
          PGPASSWORD=testpass psql -h localhost -p 5433 -U testuser -d warehouse -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO raw_cdc.diagnoses
              (diagnosis_id, encounter_id, patient_id, icd10_code, description, diagnosed_at, __op, __table, __source_ts_ns, __source_lsn, __db)
          VALUES
              (9010, 1, 999998, 'Z00.10', 'scenario 14 writer A/B race fixture', TIMESTAMP '2026-03-01 09:10:00', 'c', 'diagnoses', CAST(extract(epoch from TIMESTAMP '2026-03-01 09:10:00') * 1e9 AS BIGINT), 900000010, 'ehr'),
              (9011, 1, 999998, 'Z00.11', 'scenario 14 writer A/B race fixture', TIMESTAMP '2026-03-01 09:10:01', 'c', 'diagnoses', CAST(extract(epoch from TIMESTAMP '2026-03-01 09:10:01') * 1e9 AS BIGINT), 900000011, 'ehr'),
              (9012, 1, 999998, 'Z00.12', 'scenario 14 writer A/B race fixture', TIMESTAMP '2026-03-01 09:10:02', 'c', 'diagnoses', CAST(extract(epoch from TIMESTAMP '2026-03-01 09:10:02') * 1e9 AS BIGINT), 900000012, 'ehr'),
              (9013, 1, 999998, 'Z00.13', 'scenario 14 writer A/B race fixture', TIMESTAMP '2026-03-01 09:10:03', 'c', 'diagnoses', CAST(extract(epoch from TIMESTAMP '2026-03-01 09:10:03') * 1e9 AS BIGINT), 900000013, 'ehr'),
              (9014, 1, 999998, 'Z00.14', 'scenario 14 writer A/B race fixture', TIMESTAMP '2026-03-01 09:10:04', 'c', 'diagnoses', CAST(extract(epoch from TIMESTAMP '2026-03-01 09:10:04') * 1e9 AS BIGINT), 900000014, 'ehr');
          SQL
          cd warehouse
          ../.venv/bin/dbt run --select br_diagnoses sl_diagnoses trusted_diagnoses quarantine_diagnoses record_lineage --profiles-dir .

      - name: Race two concurrent record_lineage_event writers (scenario 14)
        # Real, independent OS processes - not dbt threads within one
        # invocation (threads: has no bearing on this race at any value;
        # see profiles.yml's and record_lineage_event.sql's own comments).
        # Both race to log the same 5 pending decisions from the step
        # above. Capture each process's actual exit code via `wait $pid` -
        # a crash here (matching the intermittent native crash this
        # project's own threads:4 re-test already confirmed under
        # concurrent writes to *different* models) is itself a real,
        # reportable finding, not just a test-harness failure.
        working-directory: warehouse
        run: |
          ../.venv/bin/dbt run --select record_lineage_event --profiles-dir . > /tmp/scenario14_writer_a.log 2>&1 &
          pid_a=$!
          ../.venv/bin/dbt run --select record_lineage_event --profiles-dir . > /tmp/scenario14_writer_b.log 2>&1 &
          pid_b=$!
          wait "$pid_a"; exit_a=$?
          wait "$pid_b"; exit_b=$?
          echo "Writer A exit code: $exit_a"
          echo "Writer B exit code: $exit_b"
          echo "$exit_a" > /tmp/scenario14_exit_a.txt
          echo "$exit_b" > /tmp/scenario14_exit_b.txt
          echo "--- Writer A log ---"; cat /tmp/scenario14_writer_a.log
          echo "--- Writer B log ---"; cat /tmp/scenario14_writer_b.log

      - name: Assert scenario 14's outcome - no duplicate event_sequence/ledger_key under concurrent writers
        run: |
          fail() { echo "::error::$1"; exit 1; }

          exit_a=$(cat /tmp/scenario14_exit_a.txt)
          exit_b=$(cat /tmp/scenario14_exit_b.txt)
          writer_crashed=false
          if [ "$exit_a" != "0" ] || [ "$exit_b" != "0" ]; then
            writer_crashed=true
            echo "::error::scenario 14: at least one concurrent writer exited non-zero (A=$exit_a, B=$exit_b) - see the previous step's logs. This is itself a real finding (possibly the same intermittent native crash confirmed under threads>1 in this environment, now under two separate processes), not a bug in this assertion step - checking the resulting table state below purely for diagnostics before failing."
          fi

          dup_seq=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM (SELECT record_token, event_sequence FROM gold.record_lineage_event GROUP BY record_token, event_sequence HAVING count(*) > 1)" \
            2>/dev/null | tail -n1)
          [ "${dup_seq:-0}" = "0" ] || fail "scenario 14: found $dup_seq (record_token, event_sequence) pair(s) logged more than once under concurrent writers - next_event_sequence_if_new()'s atomic allocator (warehouse/duckdb_plugins/lineage_seq_udf.py) failed to serialize this race (see record_lineage_event.sql's CONCURRENCY CONTRACT comment)."

          dup_key=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM (SELECT ledger_key FROM gold.record_lineage_event GROUP BY ledger_key HAVING count(*) > 1)" \
            2>/dev/null | tail -n1)
          [ "${dup_key:-0}" = "0" ] || fail "scenario 14: found $dup_key duplicate ledger_key value(s) under concurrent writers."

          logged_n=$(.venv/bin/python3 infra-setup/scripts/dq.py \
            "SELECT count(*) FROM gold.record_lineage_event q JOIN bronze.br_diagnoses b ON b.record_token = q.record_token WHERE b.diagnosis_id IN (9010, 9011, 9012, 9013, 9014) AND q.quality_status = 'FAIL'" \
            2>/dev/null | tail -n1)
          [ "${logged_n:-0}" = "5" ] || fail "scenario 14: expected exactly 5 logged FAIL decisions (one per new diagnosis, from whichever writer's insert actually landed), got $logged_n - either some were lost (both writers somehow missed one) or duplicated."

          # The table-state assertions above passing does NOT excuse a
          # crashed writer: a writer that dies after logging its own share
          # of decisions but before the other writer even starts can leave
          # this table looking perfectly clean (no duplicates, all 5
          # logged) while still being a genuine multi-writer reliability
          # failure - one of the two writers this scenario exists to prove
          # can safely race did not, in fact, survive the race. Fail here,
          # after the diagnostics above have already been printed, rather
          # than upgrading the earlier `::error::` to a hard failure
          # immediately - table state is worth seeing either way.
          if [ "$writer_crashed" = "true" ]; then
            fail "scenario 14: table state looks clean, but at least one concurrent writer crashed (A=$exit_a, B=$exit_b) - see the ::error:: above and the previous step's logs. A writer crash is not something this scenario can pass through as a warning: it is exactly the kind of multi-writer reliability failure this test exists to catch."
          fi

          echo "Scenario 14 passed: two concurrent, independent record_lineage_event writers raced on 5 newly-pending decisions with no duplicate event_sequence, no duplicate ledger_key, and no lost decisions, and neither writer crashed."

      - name: Run scenario 15 (lineage allocator concurrency + atomicity gap)
        # reliability-tests/15_lineage_allocator_atomicity.md, automated.
        # Direct concurrency tests of the Postgres allocator behind
        # scenario 14's fix (next_event_sequence_if_new(), see
        # warehouse/duckdb_plugins/lineage_seq_udf.py) - real concurrency
        # shapes scenario 14's dbt-run-based setup cannot produce (higher
        # writer counts, a same-record_token-different-decision race,
        # cross-token isolation under load), plus an executable
        # characterization of that module's one documented known
        # limitation. Uses its own dedicated, uuid-based synthetic
        # record_token values - cannot collide with scenario 14's or any
        # real record_token - so ordering relative to scenario 14 doesn't
        # matter. The script's own exit code is this step's pass/fail
        # signal (it prints its own ::error::), matching dq.py's pattern
        # elsewhere in this job.
        run: .venv/bin/python3 infra-setup/scripts/lineage_allocator_concurrency_test.py

      - name: Collect diagnostics on failure
        # A bare "job failed" with no logs is useless for triaging a
        # multi-service pipeline. Every service's log, plus dbt's own log,
        # goes to an uploaded artifact — not just workflow console output,
        # which is easy to miss and gets truncated.
        if: failure()
        run: |
          mkdir -p artifacts
          ( cd infra-setup && docker compose logs --no-color ) > artifacts/docker-compose-all.log 2>&1 || true
          for svc in db debezium warehouse-db-init metabase; do
            ( cd infra-setup && docker compose logs --no-color "$svc" ) > "artifacts/${svc}.log" 2>&1 || true
          done
          cp warehouse/logs/dbt.log artifacts/dbt.log 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Tear down
        if: always()
        working-directory: infra-setup
        run: docker compose down -v
